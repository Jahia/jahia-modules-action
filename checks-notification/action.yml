name: checks-notification
description: Send the result of a completed run on a pull request to the person who triggered it, in a direct message of a Slack app

inputs:
  slack-token:
    description: "The bot token of the Slack app, with the bot scopes chat:write, users:read and users:read.email"
    required: true
  run-id:
    description: "The ID of the completed run, such as github.event.workflow_run.id"
    required: true
  github-token:
    description: "The token that reads the run, its jobs and the commits of its pull request"
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Post the result to the person who triggered the run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SLACK_TOKEN: ${{ inputs.slack-token }}
        RUN_ID: ${{ inputs.run-id }}
      run: python3 "$GITHUB_ACTION_PATH/src/checks_notification.py"
