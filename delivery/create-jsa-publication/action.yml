name: Create a JSA publication task
description: Create a "Prepare and publish JSA-YYYY-NNNN" sub-issue from .github/ISSUE_TEMPLATE/jsa-publication.md when the Epic title starts with a JSA number

inputs:
  github_token:
    description: 'GitHub personal API token'
    required: true
  github_owner:
    description: 'GitHub org where to create the task'
    default: 'Jahia'
    required: false
  github_repo:
    description: 'GitHub repository where to create the task, and that holds the template'
    default: 'ISMS-Product'
    required: false

runs:
  using: "composite"
  steps:
    - name: Create a JSA publication task for a JSA Epic
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3
        script: |
          const owner = '${{ inputs.github_owner }}';
          const repo = '${{ inputs.github_repo }}';
          const parent = context.payload.issue;
          const templatePath = '.github/ISSUE_TEMPLATE/jsa-publication.md';

          // An Epic titled "JSA-2026-0042 - jahia-oauth" gets the task "Prepare and publish JSA-2026-0042"
          const match = /^\s*(JSA-\d{4}-\d{4})\b/i.exec(parent.title || '');
          if (!match) {
            core.info(`Epic title "${parent.title}" does not start with a JSA number, nothing to create`);
            return;
          }
          const jsa = match[1].toUpperCase();
          const title = `Prepare and publish ${jsa}`;

          // The Epic is the parent, in the repository of the event
          const parentRepo = context.repo;

          // Skip when a re-run or a person already attached the task
          try {
            const existing = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
              owner: parentRepo.owner,
              repo: parentRepo.repo,
              issue_number: parent.number,
              per_page: 100
            });
            const duplicate = existing.find(i => (i.title || '').trim().toLowerCase() === title.toLowerCase());
            if (duplicate) {
              core.info(`Sub-issue ${duplicate.html_url} already exists, nothing to create`);
              return;
            }
          } catch (error) {
            core.warning(`Unable to list the sub-issues of #${parent.number}: ${error.message}`);
          }

          let body;
          try {
            const templateFile = await github.rest.repos.getContent({ owner, repo, path: templatePath });
            const rawTemplate = Buffer.from(templateFile.data.content, 'base64').toString('utf8');
            // Remove the front matter block delimited by --- (handle both LF and CRLF)
            body = rawTemplate.replace(/^---[\s\S]*?---(\r?\n)?/, '').trim();
          } catch (error) {
            core.setFailed(`Unable to load template ${owner}/${repo}/${templatePath}: ${error.message}`);
            return;
          }

          let created;
          try {
            created = await github.rest.issues.create({ owner, repo, title, body, type: 'Task' });
          } catch (error) {
            core.setFailed(`Unable to create the JSA publication issue: ${error.message}`);
            return;
          }

          try {
            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
              owner: parentRepo.owner,
              repo: parentRepo.repo,
              issue_number: parent.number,
              sub_issue_id: created.data.id
            });
            core.info(`Created sub-issue ${created.data.html_url} under ${parent.html_url}`);
          } catch (error) {
            core.warning(`Created ${created.data.html_url} but could not attach it as a sub-issue of ${parent.html_url}: ${error.message}`);
            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: created.data.number,
                body: `Could not attach this issue as a sub-issue of ${parent.html_url}. Please link it manually.\n\nError: ${error.message}`
              });
            } catch (commentError) {
              core.warning(`Additionally failed to comment on ${created.data.html_url}: ${commentError.message}`);
            }
          }
