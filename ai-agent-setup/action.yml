name: AI Agent Setup
description: Install the Claude Code CLI on a self-hosted runner, point it at the Jahia LiteLLM gateway (or at Anthropic, with an OAuth token), and clone the cortex agentic harness

inputs:
  claude_code_version:
    description: 'Claude Code version to install (a specific version like 2.1.89, or "stable" / "latest")'
    required: false
    default: 'stable'
  claude_code_oauth_token:
    description: 'Opt-in. A Claude subscription OAuth token, from `claude setup-token`. When set, Claude Code talks to Anthropic with it and the gateway inputs are ignored. Leave it empty to use the gateway.'
    required: false
    default: ''
  anthropic_base_url:
    description: 'Base URL of the Anthropic-compatible gateway (LiteLLM). Required unless claude_code_oauth_token is set.'
    required: false
    default: ''
  anthropic_auth_token:
    description: 'Auth token for the gateway. Required unless claude_code_oauth_token is set.'
    required: false
    default: ''
  default_opus_model:
    description: 'Model served by the gateway for the "opus" alias'
    required: false
    default: ''
  default_sonnet_model:
    description: 'Model served by the gateway for the "sonnet" alias'
    required: false
    default: ''
  default_haiku_model:
    description: 'Model served by the gateway for the "haiku" alias'
    required: false
    default: ''
  cortex_repository:
    description: 'Repository holding the cortex agentic harness'
    required: false
    default: 'Jahia/cortex'
  cortex_ref:
    description: 'Git ref of cortex to check out'
    required: false
    default: 'main'
  cortex_path:
    description: 'Path (relative to the workspace) to clone cortex into'
    required: false
    default: 'cortex'
  cortex_telemetry_token:
    description: 'Credential cortex sends with its own usage telemetry (leave empty to report nothing)'
    required: false
    default: ''
  github_token:
    description: 'Token able to clone the cortex repository'
    required: true
  reuse_installed_claude_code:
    description: 'When "true" and a claude binary is already on the runner, skip the download if it matches claude_code_version: a pinned version must equal it, while "stable" or "latest" accepts whatever is installed (a runner image that bakes the CLI). Default "false" always installs.'
    required: false
    default: 'false'
  skip_smoke_tests:
    description: 'When "true", skip the two model smoke tests (the hello world and the cortex-selftest check). Each is a real model round trip that takes seconds to minutes on a slow gateway, so a caller whose next step is itself a model call can drop them. Default "false" runs both.'
    required: false
    default: 'false'

outputs:
  cortex_path:
    description: 'Absolute path of the cortex checkout'
    value: ${{ steps.paths.outputs.cortex_path }}
  claude_version:
    description: 'Version of the Claude Code CLI that was installed'
    value: ${{ steps.paths.outputs.claude_version }}

runs:
  using: 'composite'
  steps:
    - name: Install Claude Code CLI
      shell: bash
      env:
        WANTED_VERSION: ${{ inputs.claude_code_version }}
        REUSE_INSTALLED: ${{ inputs.reuse_installed_claude_code }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        if [ "$REUSE_INSTALLED" = "true" ] && command -v claude >/dev/null; then
          # `claude --version` prints "<version> (Claude Code)".
          HAVE_VERSION=$(claude --version 2>/dev/null | awk '{print $1}') || HAVE_VERSION=""
          if [ -z "$HAVE_VERSION" ]; then
            REUSE=false
          else
            case "$WANTED_VERSION" in
              stable|latest|"") REUSE=true ;;
              *) [ "$HAVE_VERSION" = "$WANTED_VERSION" ] && REUSE=true || REUSE=false ;;
            esac
          fi
          if [ "$REUSE" = "true" ]; then
            echo "Claude Code CLI $HAVE_VERSION already installed, reused (wanted: ${WANTED_VERSION:-stable})"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          echo "Installed Claude Code CLI (${HAVE_VERSION:-unreadable}) is not the wanted ${WANTED_VERSION:-stable}: installing it"
        fi
        echo "Installing Claude Code CLI (${WANTED_VERSION:-stable})"
        curl -fsSL https://claude.ai/install.sh | bash -s -- ${WANTED_VERSION}
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure Claude Code credentials
      shell: bash
      env:
        OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        GATEWAY_URL: ${{ inputs.anthropic_base_url }}
        GATEWAY_TOKEN: ${{ inputs.anthropic_auth_token }}
      run: |
        {
          echo "DISABLE_AUTOUPDATER=1"
          # A CI job runs on an ephemeral runner, so nothing an agent writes to its auto memory
          # is read again. Left on, the agent spends turns, and wall clock, on saving notes and
          # a memory index that the next runner never sees.
          echo "CLAUDE_CODE_DISABLE_AUTO_MEMORY=1"
        } >> "$GITHUB_ENV"
        if [ -n "$OAUTH_TOKEN" ]; then
          # The opt-in path: a repository that holds a subscription OAuth token talks to
          # Anthropic with it, and nothing of the gateway is exported. ANTHROPIC_AUTH_TOKEN and
          # ANTHROPIC_API_KEY both outrank CLAUDE_CODE_OAUTH_TOKEN, and the documentation does
          # not say that an empty value counts as unset, so the variables are left out
          # altogether. The model aliases then resolve to the newest models of Anthropic.
          case "$OAUTH_TOKEN" in
            *$'\n'*|*$'\r'*)
              echo "::error::claude_code_oauth_token holds a line break, so it cannot be a token"
              exit 1 ;;
          esac
          echo "::add-mask::$OAUTH_TOKEN"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$OAUTH_TOKEN" >> "$GITHUB_ENV"
          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::warning title=Competing credential::ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN is set in this job and outranks the OAuth token, so Claude Code will not use the token"
          fi
          echo "::notice title=Claude Code credentials::Claude Code uses the CLAUDE_CODE_OAUTH_TOKEN of this repository and talks to Anthropic directly. The LiteLLM gateway is not used."
          exit 0
        fi
        if [ -z "$GATEWAY_URL" ] || [ -z "$GATEWAY_TOKEN" ]; then
          echo "::error::No Claude Code credentials: set claude_code_oauth_token, or both anthropic_base_url and anthropic_auth_token"
          exit 1
        fi
        {
          echo "ANTHROPIC_BASE_URL=${{ inputs.anthropic_base_url }}"
          echo "ANTHROPIC_AUTH_TOKEN=${{ inputs.anthropic_auth_token }}"
        } >> "$GITHUB_ENV"
        if [ -n "${{ inputs.default_opus_model }}" ]; then
          echo "ANTHROPIC_DEFAULT_OPUS_MODEL=${{ inputs.default_opus_model }}" >> "$GITHUB_ENV"
        fi
        if [ -n "${{ inputs.default_sonnet_model }}" ]; then
          echo "ANTHROPIC_DEFAULT_SONNET_MODEL=${{ inputs.default_sonnet_model }}" >> "$GITHUB_ENV"
        fi
        if [ -n "${{ inputs.default_haiku_model }}" ]; then
          echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=${{ inputs.default_haiku_model }}" >> "$GITHUB_ENV"
        fi

    - name: Verify gateway connectivity
      # The opt-in OAuth path does not use the gateway, so it has nothing to reach.
      if: inputs.claude_code_oauth_token == ''
      shell: bash
      run: |
        GATEWAY_HOST=$(echo "${{ inputs.anthropic_base_url }}" | sed -E 's|^[a-z]+://([^/:]+).*|\1|')
        echo "Gateway host: $GATEWAY_HOST"
        if ! getent hosts "$GATEWAY_HOST" > /dev/null; then
          echo "::error::Cannot resolve gateway host '$GATEWAY_HOST' from this runner (is the tunnel to internal services up?)"
          echo "--- DNS diagnostics ---"
          cat /etc/resolv.conf 2>/dev/null || true
          command -v resolvectl > /dev/null && resolvectl status 2>/dev/null || true
          echo "--- Routing diagnostics ---"
          ip route show 2>/dev/null || true
          sudo wg show 2>/dev/null || true
          for ns in $(resolvectl dns 2>/dev/null | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | sort -u); do
            timeout 3 bash -c "echo > /dev/tcp/$ns/53" 2>/dev/null \
              && echo "TCP 53 to $ns: reachable" || echo "TCP 53 to $ns: UNREACHABLE"
          done
          exit 1
        fi
        HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "${{ inputs.anthropic_base_url }}") || HTTP_CODE="000"
        echo "Gateway responded with HTTP $HTTP_CODE"
        if [ "$HTTP_CODE" = "000" ]; then
          echo "::error::Gateway host '$GATEWAY_HOST' resolves but the gateway is unreachable"
          exit 1
        fi

    - name: Clone the cortex harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      with:
        repository: ${{ inputs.cortex_repository }}
        ref: ${{ inputs.cortex_ref }}
        token: ${{ inputs.github_token }}
        path: ${{ inputs.cortex_path }}
        persist-credentials: false

    - name: Configure the cortex harness environment
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.cortex_path }}
      env:
        CORTEX_TELEMETRY_TOKEN: ${{ inputs.cortex_telemetry_token }}
      run: |
        # cortex's .env holds credentials only (cortex ADR-0012): any other key there is a leftover
        # its session-start migration wakes the agent to move, which hijacks a headless prompt. The
        # status line, which is also the reporting switch (cortex ADR-0022), is on by default.
        if [ -z "$CORTEX_TELEMETRY_TOKEN" ]; then
          # The standing refusal cortex understands. Without it, the harness's session-start
          # notice asks the agent a question nobody is there to answer.
          echo "CORTEX_TELEMETRY=off" >> "$GITHUB_ENV"
          echo "::notice::No cortex telemetry credential supplied - this run reports nothing"
          exit 0
        fi
        printf 'CORTEX_TELEMETRY_TOKEN=%s\n' "$CORTEX_TELEMETRY_TOKEN" >> .env
        echo "Telemetry credential written to $(pwd)/.env"
        # Since Claude Code 2.1.282 the assistant reads its telemetry from its LAUNCH ENVIRONMENT
        # alone: project-scoped settings files no longer set it (cortex ADR-0022, 2026-09-29
        # amendments). A developer's shell gets this block from cortex's mise.toml [env] table via
        # `mise activate`; this headless runner gets the same block from the job environment,
        # hardcoded because no interactive setup exists here. It is a mirror of the map cortex
        # states in tools/cortex-telemetry/lib/telemetry_env.py - a change starts there.
        {
          echo "CLAUDE_CODE_ENABLE_TELEMETRY=1"
          echo "CLAUDE_CODE_OTEL_HEADERS_HELPER_DEBOUNCE_MS=60000"
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=https://telemetry.ai.sandbox.jahia.com"
          echo "OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=cumulative"
          echo "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
          echo "OTEL_LOGS_EXPORTER=otlp"
          echo "OTEL_LOG_TOOL_CONTENT=0"
          echo "OTEL_LOG_TOOL_DETAILS=0"
          echo "OTEL_LOG_USER_PROMPTS=0"
          echo "OTEL_METRICS_EXPORTER=otlp"
          echo "OTEL_METRICS_INCLUDE_ACCOUNT_UUID=false"
          echo "OTEL_METRICS_INCLUDE_REPOSITORY=true"
          echo "OTEL_METRICS_INCLUDE_SESSION_ID=false"
          echo "OTEL_METRICS_INCLUDE_VERSION=true"
          echo "OTEL_METRIC_EXPORT_INTERVAL=60000"
          echo "OTEL_RESOURCE_ATTRIBUTES=harness=cortex,provider=anthropic"
          echo "OTEL_TRACES_EXPORTER=none"
        } >> "$GITHUB_ENV"
        echo "Telemetry launch environment exported to the job"

    - name: Install mise and the programs the cortex harness pins
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.cortex_path }}
      run: |
        # Every cortex tool launches through `mise exec` (cortex ADR-0031), including the
        # fail-closed PreToolUse guards its .claude/settings.json runs before every file
        # write. On a runner without mise those guards exit 127 and the harness refuses
        # EVERY Write — the agent then finishes its work but cannot deliver its result file
        # (that is exactly how a review run goes green without posting a review). So mise is
        # not optional tooling here: it is what makes the harness writable at all.
        export PATH="$HOME/.local/bin:$PATH"
        if ! command -v mise >/dev/null; then
          echo "::group::Installing mise"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh
          echo "::endgroup::"
        fi
        mise --version
        # A fresh headless clone: trust its mise.toml (nobody is here to answer the prompt),
        # then run the two installs cortex's README asks for after every clone.
        mise trust
        echo "::group::mise install — the programs mise.toml pins"
        mise install
        echo "::endgroup::"
        echo "::group::mise run libraries — the tools' Python libraries into the venv"
        mise run libraries
        echo "::endgroup::"

    # The cortex-secret-mask mod masks a credential in the output of a tool before the model
    # reads it. The README of ai-agent-setup states what it covers and when a step warns.
    - name: Prepare the secret mask of the agent sessions
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.cortex_path }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        # A cortex_ref with no mod: each session then warns that its stream names no mod.
        [ -d mods/cortex-secret-mask ] || exit 0
        echo "CORTEX_MASK_MOD_DIR=$PWD/mods/cortex-secret-mask" >> "$GITHUB_ENV"
        if GITLEAKS_BIN=$(mise which gitleaks); then
          dirname "$GITLEAKS_BIN" >> "$GITHUB_PATH"
        else
          echo "::warning title=Partial secret mask::mise found no gitleaks for this cortex_ref, so the mask applies its built-in patterns alone"
        fi
        # A hooks module that fails to load still shows in the init event, so the tests decide.
        echo "::group::claude plugin test mods/cortex-secret-mask"
        TEST_EXIT=0
        timeout 30 claude plugin test mods/cortex-secret-mask || TEST_EXIT=$?
        echo "::endgroup::"
        if [ "$TEST_EXIT" -ne 0 ]; then
          echo "::warning title=Broken secret mask::claude plugin test exited $TEST_EXIT on mods/cortex-secret-mask, so the sessions may read the output of their tools unmasked"
        fi

    - name: Install the GitHub CLI if missing
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        if command -v gh >/dev/null; then
          echo "gh already present: $(gh --version | head -1)"
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) echo "::error::Unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        VERSION=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest | sed 's|.*/v||')
        echo "Installing gh v$VERSION ($ARCH) into ~/.local/bin"
        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_${ARCH}.tar.gz" \
          | tar -xz --strip-components=2 -C "$HOME/.local/bin" "gh_${VERSION}_linux_${ARCH}/bin/gh"
        gh --version | head -1

    - name: Verify installation and prerequisites
      id: paths
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        CLAUDE_VERSION=$(claude --version)
        echo "Claude Code CLI installed: $CLAUDE_VERSION"
        # Pre-trust the cortex checkout: without this, Claude Code ignores the
        # permissions carried by the repository's own .claude/settings.json.
        CORTEX_PATH="${{ github.workspace }}/${{ inputs.cortex_path }}" python3 - <<'EOF'
        import json, os
        path = os.path.expanduser('~/.claude.json')
        config = {}
        if os.path.exists(path):
            with open(path, encoding='utf-8') as fh:
                config = json.load(fh)
        project = config.setdefault('projects', {}).setdefault(os.environ['CORTEX_PATH'], {})
        project['hasTrustDialogAccepted'] = True
        with open(path, 'w', encoding='utf-8') as fh:
            json.dump(config, fh)
        EOF
        # Ephemeral runners provide a fresh image every run: prerequisites must come from
        # the image itself. Warn (do not fail) so the calling use case decides what is fatal.
        for bin in git python3 unzip gh; do
          command -v "$bin" >/dev/null || echo "::warning::'$bin' is not available on this runner — parts of the cortex harness need it"
        done
        echo "cortex_path=${{ github.workspace }}/${{ inputs.cortex_path }}" >> "$GITHUB_OUTPUT"
        echo "claude_version=$CLAUDE_VERSION" >> "$GITHUB_OUTPUT"

    # A real end-to-end round trip (CLI -> gateway -> model): auth, model aliases and the
    # network path are all exercised, so a broken setup fails HERE, not mid-agent-run.
    - name: Smoke-test the model gateway (hello world)
      if: inputs.skip_smoke_tests != 'true'
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        OUTPUT=$(claude -p "Reply with exactly one word: ok" --permission-mode dontAsk --output-format json 2> /tmp/claude-smoke.stderr) || {
          echo "::error::Claude Code smoke test failed — the agent cannot reach the model through the gateway"
          tail -5 /tmp/claude-smoke.stderr || true
          printf '%s\n' "$OUTPUT" | tail -5
          exit 1
        }
        printf '%s' "$OUTPUT" | python3 -c "
        import json, sys
        result = json.load(sys.stdin)
        if result.get('is_error'):
            print('::error::Smoke test returned an error: ' + str(result.get('result'))[:300])
            sys.exit(1)
        models = ', '.join(result.get('modelUsage', {}).keys()) or 'unknown'
        print(f\"Hello-world OK — model(s): {models}, duration: {result.get('duration_ms')}ms, response: {str(result.get('result'))[:80]!r}\")
        "

    # The hello world proves the gateway; this proves the HARNESS: started from the cortex
    # checkout, the agent must see cortex's skills. It asks for the cortex-selftest skill's fixed
    # token — a string that lives nowhere but that skill. A genuinely loaded harness surfaces it;
    # a missing one cannot. The token is asked for by the skill's exact name and checked against a
    # literal, so the result does not depend on the model picking one skill out of ~40 from a fuzzy
    # description — the coupling that turned a healthy harness red when the model named a skill that
    # does not exist. The token is a contract with Jahia/cortex; see its ADR-0017.
    - name: Verify the agent sees the cortex harness
      if: inputs.skip_smoke_tests != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.cortex_path }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        OUTPUT=$(claude -p "Run the Cortex self-test: use the cortex-selftest skill and reply with ONLY the token it gives you — no other text." --permission-mode dontAsk --output-format json 2> /tmp/claude-cortex-check.stderr) || {
          echo "::error::Cortex harness check failed to run"
          tail -5 /tmp/claude-cortex-check.stderr || true
          exit 1
        }
        printf '%s' "$OUTPUT" | python3 -c "
        import json, sys
        expected = 'CORTEX-SELFTEST-OK-7fK2aQ9x'
        result = json.load(sys.stdin)
        answer = str(result.get('result', ''))
        if result.get('is_error') or expected not in answer:
            print('::error::The agent does not see the cortex harness (expected the cortex-selftest token). Answer: ' + answer[:200])
            sys.exit(1)
        print('Cortex harness OK — cortex-selftest token returned')
        "
