name: AI pull request summary
description: Runs a Claude Code agent from the cortex harness to summarize one pull request for its reviewer, and writes the summary as a JSON file

inputs:
  target_url:
    description: 'URL of the pull request to summarize (the agent derives the repository and number from it)'
    required: true
  github_token:
    description: 'Token the agent uses to read the pull request'
    required: true
  cortex_path:
    description: 'Absolute path of the cortex checkout (from ai-agent-setup)'
    required: true
  model:
    description: 'Model the agent runs on, passed to the Claude Code CLI as --model. Empty means no --model at all. Summarizing a pull request is not reasoning-heavy, so it runs on sonnet.'
    required: false
    default: 'sonnet'
  allowed_tools:
    description: 'Claude Code --allowedTools value. Read-only over the forge plus a local file write (the summary file). Summarizing needs no checkout and no code.'
    required: false
    default: 'Read,Write,Grep,Glob,TodoWrite,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue list:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh repo view:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(mkdir:*),Bash(python3 -m json.tool:*)'
  disallowed_tools:
    description: 'Claude Code --disallowedTools value. A deny rule beats an allow rule: every way the agent could write to the forge or to code. It reports; posting is the job of another action.'
    required: false
    default: 'Edit,NotebookEdit,MultiEdit,Bash(git push:*),Bash(git commit:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh label:*),Bash(gh release:*),Bash(gh workflow:*),Bash(gh secret:*),Bash(gh api --method POST:*),Bash(gh api --method PATCH:*),Bash(gh api --method PUT:*),Bash(gh api --method DELETE:*),Bash(gh api -X POST:*),Bash(gh api -X PATCH:*),Bash(gh api -X PUT:*),Bash(gh api -X DELETE:*)'

outputs:
  summary_file:
    description: 'Path of the JSON file {"bullets": [...], "files": [...]}, or empty when the run failed or wrote no valid JSON'
    value: ${{ steps.check.outputs.summary_file }}

runs:
  using: 'composite'
  steps:
    - name: Prepare the prompt
      id: prep
      shell: bash
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: |
        LOG_DIR="$RUNNER_TEMP/pr-summary"
        mkdir -p "$LOG_DIR"
        TARGET_URL="$TARGET_URL" OUTPUT_FILE="$LOG_DIR/summary.json" python3 -c '
        import os, sys
        text = open(sys.argv[1]).read()
        for key in ("TARGET_URL", "OUTPUT_FILE"):
            text = text.replace("__" + key + "__", os.environ[key])
        open(sys.argv[2], "w").write(text)
        ' "$GITHUB_ACTION_PATH/prompt.md" "$LOG_DIR/prompt.md"
        echo "log_dir=$LOG_DIR" >> "$GITHUB_OUTPUT"

    # A failed run must not fail the job: the notification then shows its failure line.
    - name: Run the summary agent
      shell: bash
      working-directory: ${{ inputs.cortex_path }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        AGENT_MODEL: ${{ inputs.model }}
        LOG_DIR: ${{ steps.prep.outputs.log_dir }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        MODEL_FLAG=""
        [ -n "$AGENT_MODEL" ] && MODEL_FLAG="--model $AGENT_MODEL"
        # --add-dir: the log dir lives outside the cortex cwd, which Claude Code otherwise refuses
        claude -p "$(cat "$LOG_DIR/prompt.md")" \
          --allowedTools "$ALLOWED_TOOLS" \
          --disallowedTools "$DISALLOWED_TOOLS" \
          --add-dir "$LOG_DIR" \
          --permission-mode dontAsk \
          --output-format stream-json \
          --verbose $MODEL_FLAG \
          > "$LOG_DIR/stream.jsonl" 2> "$LOG_DIR/stderr.log" \
          || echo "::warning::The summary agent exited with code $?"

    - name: Check the summary file
      id: check
      if: always()
      shell: bash
      env:
        SUMMARY_FILE: ${{ steps.prep.outputs.log_dir }}/summary.json
      run: |
        if python3 -c '
        import json, sys
        data = json.load(open(sys.argv[1]))
        assert isinstance(data["bullets"], list) and isinstance(data["files"], list)
        ' "$SUMMARY_FILE" 2>/dev/null; then
          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::The agent wrote no valid summary JSON"
          echo "summary_file=" >> "$GITHUB_OUTPUT"
        fi
