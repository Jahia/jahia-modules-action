name: AI PR Review
description: Runs a Claude Code agent from the cortex harness to review one pull request and submit its findings as a single COMMENT review

inputs:
  pr_url:
    description: 'URL of the pull request to review (the agent derives the repository and what to check out from it)'
    required: true
  github_token:
    description: 'Token used by the agent to read the PR and submit the review. Use the AI reviewer account''s token: submitting the review with it fulfills (clears) the review request, which is what makes "one review per request" deterministic.'
    required: true
  cortex_path:
    description: 'Absolute path of the cortex checkout (from ai-agent-setup)'
    required: true
  marker:
    description: 'Hidden marker string the agent must put in every review body'
    required: false
    default: '<!-- cortex-pr-review -->'
  post_review:
    description: 'true: submit the review on the PR; false: review mode — store the would-be review under logs_dir/reviews instead (nothing is posted, the review request stays pending)'
    required: false
    default: 'true'
  debug:
    description: 'Run the Claude Code CLI with --debug: API/CLI-level detail lands in review.stderr.log inside the logs artifact'
    required: false
    default: 'false'
  job_timeout_minutes:
    description: 'The timeout-minutes of the job running this action. The agent is stopped a few minutes BEFORE it, by this action, so the trace, the transcript and the logs artifact are still produced — letting the job timeout hit instead cancels the job mid-step and loses all of that. Pass the job timeout unchanged: the reserve is subtracted here, because GitHub Actions expressions have no arithmetic operators.'
    required: false
    default: '30'
  allowed_tools:
    description: 'Claude Code --allowedTools value for the agent: read/search tools, local file writes (the review body file), read-only git/gh, and the throwaway clone surface. The agent never posts — submitting the review file is a deterministic step of this action.'
    required: false
    default: 'Read,Write,Grep,Glob,Skill,Task,Agent,TodoWrite,ReportFindings,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git branch --show-current),Bash(git branch --list),Bash(git branch -a),Bash(git branch -r),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(git blame:*),Bash(git cat-file:*),Bash(git fetch:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr checkout:*),Bash(gh issue view:*),Bash(gh repo view:*),Bash(gh repo clone:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(mkdir:*),Bash(python3 -m json.tool:*)'
  disallowed_tools:
    description: 'Claude Code --disallowedTools value. A deny rule beats an allow rule, including one the cloned repository''s own settings could carry: editing tools, every way a review could reach the forge or rewrite history, and the options of allowed commands that write (--output) or execute (--upload-pack).'
    required: false
    default: 'Edit,NotebookEdit,MultiEdit,Bash(git push:*),Bash(git commit:*),Bash(git switch:*),Bash(git checkout:*),Bash(git reset:*),Bash(git remote:*),Bash(git * --output*),Bash(git * --upload-pack*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh api:*),Bash(gh release:*),Bash(gh workflow:*),Bash(gh secret:*)'

outputs:
  logs_dir:
    description: 'Directory holding the review run logs (prompt, agent stream, result) — upload it as an artifact'
    value: ${{ steps.prep.outputs.logs_dir }}

runs:
  using: 'composite'
  steps:
    - name: Prepare the review prompt and the log directory
      id: prep
      shell: bash
      env:
        PR_URL: ${{ inputs.pr_url }}
        MARKER: ${{ inputs.marker }}
        POST_REVIEW: ${{ inputs.post_review }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        # First thing, before anything that can fail: the upload steps need this directory to
        # exist even when this step dies, otherwise the failure costs us the logs too.
        LOG_DIR="$RUNNER_TEMP/pr-review-logs"
        mkdir -p "$LOG_DIR"
        AGENT="Claude Code $(claude --version 2>/dev/null | head -1 || echo '(version unknown)')"
        if [ -n "$ANTHROPIC_DEFAULT_SONNET_MODEL" ]; then
          AGENT="$AGENT · model: $ANTHROPIC_DEFAULT_SONNET_MODEL"
        fi
        export AGENT
        PR_KEY=$(python3 "$GITHUB_ACTION_PATH/src/build-prompt.py" "$GITHUB_ACTION_PATH/prompt.md" "$LOG_DIR")
        echo "Prepared the review prompt for $PR_URL"
        # Reviews submitted by this run must be newer than this instant (verification step).
        echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
        echo "logs_dir=$LOG_DIR" >> "$GITHUB_OUTPUT"
        echo "pr_key=$PR_KEY" >> "$GITHUB_OUTPUT"

    - name: Run the review agent
      shell: bash
      working-directory: ${{ inputs.cortex_path }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        CLAUDE_DEBUG: ${{ inputs.debug }}
        JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        PR_KEY: ${{ steps.prep.outputs.pr_key }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        # The agent gets a budget of its own, below the job timeout. Reaching it is a plain
        # step failure we control: the steps below still render the trace and the transcript,
        # and the workflow still uploads the artifact. A job timeout instead cancels the job
        # mid-step and none of that survives.
        # The subtraction lives here and not in the caller's `with:` on purpose: GitHub
        # Actions expressions have no arithmetic operators, so subtracting in a template
        # expression is a syntax error rather than a value.
        # (Careful writing that out: GitHub expands template expressions inside `run:`
        # bodies before the shell sees them, so even one in a comment is evaluated.)
        RESERVE_MINUTES=5
        case "$JOB_TIMEOUT_MINUTES" in
          ''|*[!0-9]*|0) echo "::warning::job_timeout_minutes='$JOB_TIMEOUT_MINUTES' is not a positive integer, falling back to 30"; JOB_TIMEOUT_MINUTES=30 ;;
        esac
        TIMEOUT_MINUTES=$((JOB_TIMEOUT_MINUTES - RESERVE_MINUTES))
        if [ "$TIMEOUT_MINUTES" -lt 1 ]; then
          # Job timeout too small to reserve anything from — still give the agent a minute,
          # so the failure is ours (with logs) rather than a job cancellation.
          TIMEOUT_MINUTES=1
        fi
        {
          echo "### AI PR review run"
          echo ""
          echo "| Scope | Outcome | Turns | Duration | Cost (USD) | Exit code |"
          echo "|---|---|---|---|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Reviewing: $PR_KEY"
        echo "::group::Prompt given to the agent"
        cat "$LOG_DIR/review.prompt.md"
        echo "::endgroup::"
        STREAM_FILE="$LOG_DIR/review.stream.jsonl"
        DEBUG_FLAG=""
        [ "$CLAUDE_DEBUG" = "true" ] && DEBUG_FLAG="--debug"
        echo "Agent budget: ${TIMEOUT_MINUTES}m of wall clock"
        echo "--- Agent progress (elapsed · event · detail), live ---"
        # --add-dir: the log dir lives outside the cortex cwd, which Claude Code otherwise refuses
        # timeout: SIGTERM at the budget, SIGKILL 30s later if the CLI does not exit on its own.
        # The stream-json stdout goes through stream-progress.py rather than straight to a file:
        # it writes the raw stream to $STREAM_FILE *and* narrates it here as it arrives, so this
        # step reads like any build step instead of staying silent until the agent is done.
        # set +e / PIPESTATUS: the pipeline must report the agent's exit code, not the narrator's.
        set +e
        timeout --signal=TERM --kill-after=30s "${TIMEOUT_MINUTES}m" \
          claude -p "$(cat "$LOG_DIR/review.prompt.md")" \
          --allowedTools "$ALLOWED_TOOLS" \
          --disallowedTools "$DISALLOWED_TOOLS" \
          --add-dir "$LOG_DIR" \
          --permission-mode dontAsk \
          --output-format stream-json \
          --verbose $DEBUG_FLAG \
          2> "$LOG_DIR/review.stderr.log" \
          | python3 -u "$GITHUB_ACTION_PATH/src/stream-progress.py" "$STREAM_FILE"
        EXIT_CODE=${PIPESTATUS[0]}
        set -e
        # --no-trace: the run was just narrated live, no need to replay every event here.
        python3 "$GITHUB_ACTION_PATH/src/summarize-run.py" "$STREAM_FILE" "$PR_KEY" "$EXIT_CODE" --no-trace
        # The artifact gets the full human-readable transcript (the console shows the compact trace)
        python3 "$GITHUB_ACTION_PATH/src/render-transcript.py" "$STREAM_FILE" "$LOG_DIR/review.transcript.log"
        # 124/137: `timeout` stopped the agent. It had not finished reviewing — that is a budget
        # problem, not a broken run, so say so and fail the step (the logs are already collected).
        if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 137 ]; then
          echo "::error title=AI review timed out::The agent was stopped after ${TIMEOUT_MINUTES}m without delivering a review. The partial session is in the run's ai-pr-review-logs artifact (review.transcript.log). Raise timeout_job on the calling workflow if this PR legitimately needs longer, then re-request the review."
          exit 1
        fi
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "::warning::Agent exited with code $EXIT_CODE — the review request stays pending; re-run this workflow or re-request the review to retry"
        fi

    # The agent only writes the review file; posting is deterministic and happens here,
    # outside the agent's permission surface (cortex's own settings ask-gate pr review,
    # which a headless dontAsk run cannot answer).
    - name: Submit the review
      if: inputs.post_review == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_URL: ${{ inputs.pr_url }}
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        PR_KEY: ${{ steps.prep.outputs.pr_key }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        FILE="$LOG_DIR/reviews/pr-$PR_KEY.review.json"
        if [ ! -s "$FILE" ]; then
          echo "::warning::The agent produced no review file — nothing to submit (the review request stays pending)"
          exit 0
        fi
        python3 "$GITHUB_ACTION_PATH/src/submit-review.py" post "$FILE" "$PR_URL"

    - name: Publish the stored review to the job summary
      if: always() && inputs.post_review != 'true'
      shell: bash
      env:
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
      run: |
        {
          echo "### Review mode — PR review that WOULD have been submitted"
          echo ""
          for f in "$LOG_DIR"/reviews/*.review.json; do
            [ -e "$f" ] || { echo "_No review file was produced._"; break; }
            echo "<details><summary>$(basename "$f")</summary>"
            echo ""
            python3 "$GITHUB_ACTION_PATH/src/submit-review.py" render "$f"
            echo ""
            echo "</details>"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify the pull request received the review
      uses: actions/github-script@v9
      if: always() && inputs.post_review == 'true'
      env:
        PR_URL: ${{ inputs.pr_url }}
        MARKER: ${{ inputs.marker }}
        STARTED_AT: ${{ steps.prep.outputs.started_at }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const [, owner, repo, number] = process.env.PR_URL.match(/([^/]+)\/([^/]+)\/pull\/(\d+)$/)
          const reviews = await github.paginate(github.rest.pulls.listReviews,
            { owner, repo, pull_number: Number(number), per_page: 100 })
          const done = reviews.some(r =>
            (r.body ?? '').includes(process.env.MARKER) &&
            new Date(r.submitted_at) > new Date(process.env.STARTED_AT))
          if (done) core.info(`${process.env.PR_URL}: review submitted`)
          else core.warning(`${process.env.PR_URL}: NO review was submitted by this run — the review request stays pending; re-run this workflow or re-request the review to retry`)
