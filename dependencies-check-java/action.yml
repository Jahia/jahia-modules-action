name: Check Java dependencies
description: Comment on the PR with the Java dependencies and licenses it changes, compared with its base branch

inputs:
  license_allowlist:
    description: 'File containing the allowed licenses, as one Python regular expression matched case-insensitively'
  github_token:
    description: 'Github token'
    required: true
  show_checklist:
    description: 'Show the dependency checklist'
    default: "true"
  root_folder:
    description: 'Change the root folder'
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set mvn local repo location
      shell: bash
      run: |
        echo "MVN_LOCAL_REPO=$(echo ~/.m2/repository)" >> $GITHUB_ENV
        echo "Base local mvn repo set to: $MVN_LOCAL_REPO"

    - name: Clone base branch repository
      shell: bash
      run: |
        BASE_REPO_DIR="/tmp/base-repo"
        mkdir -p "${BASE_REPO_DIR}"
        echo "BASE_REPO_DIR=${BASE_REPO_DIR}" >> $GITHUB_ENV
        echo "Using ${BASE_REPO_DIR} as base repository directory"
        # Clone the branch the pull request targets, not the repository's default branch:
        # the workspace is the pull request merged into that branch, so it is the only
        # baseline against which the difference is the pull request's own work.
        # github.base_ref is set on pull_request events only, hence the fallback.
        BASE_BRANCH="${{ github.base_ref || github.event.repository.default_branch }}"
        echo "Cloning branch $BASE_BRANCH"
        git clone --depth 1 --branch "${BASE_BRANCH}" https://x-access-token:${{ inputs.github_token }}@github.com/${{ github.repository }}.git ${BASE_REPO_DIR}
        echo "Commit hash of base branch:"
        git rev-parse HEAD

    - name: Get base POM
      shell: bash
      run: |
        if [ -f "${BASE_REPO_DIR}/${{ inputs.root_folder }}/pom.xml" ]; then
          echo "BASE_POM_NOT_FOUND=0" >> $GITHUB_ENV
          echo "Base POM found"
        else
          echo "BASE_POM_NOT_FOUND=1" >> $GITHUB_ENV
          echo "Base POM not found"
        fi

    - name: Generate base cache key seed
      shell: bash
      if: ${{ env.BASE_POM_NOT_FOUND == 0 }}
      run: |
        find "${BASE_REPO_DIR}" -name 'pom.xml' -type f | sort | xargs cat > base_maven_cache_seed || true
        if [[ -s base_maven_cache_seed ]]; then
          echo "BASE_MAVEN_CACHE_KEY_SUFFIX=$(sha256sum base_maven_cache_seed | cut -d' ' -f1)" >> $GITHUB_ENV
        else
          echo "BASE_MAVEN_CACHE_KEY_SUFFIX=no-pom" >> $GITHUB_ENV
        fi

    - name: Restore base dependencies from cache
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      if: ${{ env.BASE_POM_NOT_FOUND == 0 }}
      with:
        key: ${{ runner.os }}-maven-${{ env.BASE_MAVEN_CACHE_KEY_SUFFIX }}
        restore-keys: ${{ runner.os }}-maven-
        path: ~/.m2/repository

    - name: Analyze the dependencies of the base branch
      shell: bash
      if: ${{ env.BASE_POM_NOT_FOUND == 0 }}
      run: bash "${{ github.action_path }}/analyze.sh" "${BASE_REPO_DIR}/${{ inputs.root_folder }}/pom.xml" "${{ runner.temp }}/dependencies-check-java/base"

    - name: Analyze the dependencies of the pull request
      shell: bash
      run: bash "${{ github.action_path }}/analyze.sh" "${{ inputs.root_folder }}/pom.xml" "${{ runner.temp }}/dependencies-check-java/head"

    - name: Compare with the base branch
      id: report
      shell: bash
      continue-on-error: true
      env:
        REPORT_DIR: ${{ runner.temp }}/dependencies-check-java
        ALLOWLIST_FILE: ${{ inputs.license_allowlist || format('{0}/license-allowlist-java.txt', github.action_path) }}
        BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        BASE_FOUND: ${{ env.BASE_POM_NOT_FOUND == 0 }}
        SHOW_CHECKLIST: ${{ inputs.show_checklist }}
      run: |
        if ! command -v python3 > /dev/null; then
          echo "::warning::dependencies-check-java: the runner has no python3, so the dependencies were not compared."
          exit 0
        fi
        python3 "${{ github.action_path }}/src/report.py"

    # With no change, only an earlier report is updated. A token that may not comment, as on a
    # pull request from a fork, leaves the report in the job summary.
    - name: Comment on the pull request
      if: ${{ github.event.pull_request && steps.report.outputs.has_changes != '' }}
      uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 #v3.0.2
      continue-on-error: true
      with:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        header: dependencies-check-java ${{ github.workflow }}/${{ inputs.root_folder }}
        number: ${{ github.event.pull_request.number }}
        path: ${{ runner.temp }}/dependencies-check-java/comment.md
        only_update: ${{ steps.report.outputs.has_changes != 'true' }}
