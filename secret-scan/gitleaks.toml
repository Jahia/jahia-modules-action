# The Jahia base configuration of the secret-scan action, for a repository with no .gitleaks.toml.
# A repository that writes its own file replaces this one, so it copies these entries it needs.

[extend]
useDefault = true

[[allowlists]]
description = "Public local-development defaults. They open no real environment."
regexes = [
  # The root password of the Jahia Docker image, used throughout local setups and Cypress tests.
  '''root1234''',
  # The third-party key that the Apache Unomi documentation ships, used by local jCustomer setups.
  '''670c26d1cc413346c3b2fd9ce65dab41''',
]
