# The Jahia base configuration of the secret-scan action, for a repository with no .gitleaks.toml.
# A repository that writes its own file replaces this one, so it copies the entries it needs.

[extend]
useDefault = true

[[allowlists]]
description = "Public local-development defaults. They open no real environment."
regexes = [
  # The root password of the Jahia Docker image, alone or in a curl user, used by local setups.
  # Anchored, because gitleaks matches an allowlist regex anywhere in the secret it found.
  '''^(root:)?root1234$''',
  # The default third-party key of Apache Unomi, used by local jCustomer setups.
  '''^670c26d1cc413346c3b2fd9ce65dab41$''',
  # A quoted shell variable as a curl user with no password, such as `-u "$SONAR_TOKEN:"`.
  '''^"\$\{?[A-Za-z_][A-Za-z0-9_]*\}?:"$''',
  # The account key of devstoreaccount1, the account of the Azure storage emulator that Microsoft publishes.
  # @azure/storage-blob carries it into the dist/ of an action that bundles @actions/artifact.
  '''^Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==$''',
]

# A password in the user part of a URL, such as postgresql://user:password@host/db.
# The default rules miss it, because such a password is often short and has a low entropy.
[[rules]]
id = "url-with-password"
description = "A database or message broker URL that carries a password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|clickhouse)://[^\s:/?#@"'`]+:([^\s/?#@"'`]{4,})@'''
secretGroup = 1
keywords = ["postgres", "mysql", "mariadb", "mongodb", "redis", "amqp", "clickhouse"]

[[rules.allowlists]]
description = "A variable or a placeholder in place of the password, such as ${DB_PASSWORD} or <password>."
regexes = ['''^(?:\$|\{\{|<|%)''']

# A file that holds the settings or the credentials of one developer, whatever its content.
# A rule on the path reports a commit that adds or changes the file, and not one that deletes it.
[[rules]]
id = "local-settings-file"
description = "A file of per-developer settings or credentials, which stays out of git"
path = '''(?:^|/)(?:\.claude/settings\.local\.json|mise\.local\.toml|\.netrc|\.git-credentials|\.aws/credentials)$'''
