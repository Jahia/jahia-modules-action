name: Secret Scan
description: |
  Scans the commits of a pull request with gitleaks, and fails when one of them adds a secret.

  The scan reads the commits between the base and the head of the pull request, so its cost
  follows the size of the pull request, and a finding on another branch never fails this one.
  The configuration comes from the base commit: the `.gitleaks.toml` there, or the Jahia base
  configuration beside this action when there is none. See README.md.

runs:
  using: composite
  steps:
    - name: Check the range
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
          echo "::error::No range to scan: run the action on a pull request event"
          exit 1
        fi

    - name: Checkout the history without the file contents
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      with:
        # A directory of its own, so a job that already checked its sources out keeps them.
        path: .secret-scan
        # Every commit and tree, and only the blobs the scan reads, fetched on demand.
        fetch-depth: 0
        filter: blob:none
        # No file lands on disk, because gitleaks would read a .gitleaksignore of the pull request.
        sparse-checkout: /.secret-scan-reads-no-file
        sparse-checkout-cone-mode: false

    - name: Pin gitleaks
      id: gitleaks
      shell: bash
      env:
        VERSION: 8.30.1
        SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        # The id of the same archive in the API of GitHub, which lists it at repos/gitleaks/gitleaks/releases/tags/v<VERSION>.
        # VERSION, SHA256 and ASSET_ID change together: a stale ASSET_ID fails the SHA-256 check of the second download source.
        ASSET_ID: "378332058"
      run: |
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "::error::The pinned gitleaks archive is for x86_64, and this runner is $(uname -m)"
          exit 1
        fi
        TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
        {
          echo "key=secret-scan-gitleaks-${VERSION}-${SHA256}"
          echo "archive=$RUNNER_TEMP/gitleaks-archive/$TARBALL"
          echo "release-url=https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"
          echo "asset-url=https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${ASSET_ID}"
          echo "sha256=$SHA256"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the gitleaks archive
      id: cache
      # A pull request reads the cache that its earlier runs saved, so a later run downloads nothing.
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.gitleaks.outputs.archive }}
        key: ${{ steps.gitleaks.outputs.key }}

    - name: Install gitleaks
      shell: bash
      env:
        ARCHIVE: ${{ steps.gitleaks.outputs.archive }}
        RELEASE_URL: ${{ steps.gitleaks.outputs.release-url }}
        ASSET_URL: ${{ steps.gitleaks.outputs.asset-url }}
        SHA256: ${{ steps.gitleaks.outputs.sha256 }}
        TOKEN: ${{ github.token }}
      run: |
        if [ ! -f "$ARCHIVE" ]; then
          mkdir -p "$(dirname "$ARCHIVE")"
          # --retry alone fails on a reset connection or a cut transfer, so --retry-all-errors retries them too.
          # --max-time ends a stalled attempt, which curl then retries.
          DOWNLOAD=(curl -fsSL --retry 5 --retry-all-errors --max-time 60 -o "$ARCHIVE")
          if ! "${DOWNLOAD[@]}" "$RELEASE_URL"; then
            echo "::warning::The release page of gitleaks failed, so the archive comes from the API of GitHub"
            # The header comes on stdin, so the token stays out of the command line that ps shows.
            # curl sends the token to api.github.com only, and not to the storage host that the API redirects to.
            printf 'Authorization: Bearer %s\n' "$TOKEN" \
              | "${DOWNLOAD[@]}" -H @- -H "Accept: application/octet-stream" "$ASSET_URL"
          fi
        fi
        echo "$SHA256  $ARCHIVE" | sha256sum --check --quiet
        mkdir -p "$RUNNER_TEMP/gitleaks"
        tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/gitleaks" gitleaks
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

    - name: Save the gitleaks archive
      # The save follows the check of the SHA-256 and comes before the scan, so a run with a finding saves the archive too.
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ steps.gitleaks.outputs.archive }}
        key: ${{ steps.gitleaks.outputs.key }}

    - name: Scan the commits of the range
      id: scan
      shell: bash
      env:
        REPO: .secret-scan
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_CONFIG: ${{ github.action_path }}/gitleaks.toml
      run: |
        # The configuration comes from the base commit, so a pull request cannot relax its own scan.
        SETTINGS="$RUNNER_TEMP/secret-scan"
        mkdir -p "$SETTINGS/ignore"
        CONFIG="$BASE_CONFIG"
        if git -C "$REPO" cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
          CONFIG="$SETTINGS/gitleaks.toml"
          git -C "$REPO" show "$BASE_SHA:.gitleaks.toml" > "$CONFIG"
        fi
        if git -C "$REPO" cat-file -e "$BASE_SHA:.gitleaksignore" 2>/dev/null; then
          git -C "$REPO" show "$BASE_SHA:.gitleaksignore" > "$SETTINGS/ignore/.gitleaksignore"
        fi
        if [ -n "$(git -C "$REPO" diff --name-only "$BASE_SHA...$HEAD_SHA" -- .gitleaks.toml .gitleaksignore)" ]; then
          echo "::warning::This pull request changes .gitleaks.toml or .gitleaksignore. The scan used the files of the base branch, and the change applies once it merges."
        fi
        # --gitleaks-ignore-path replaces the default, which is the working directory of the job.
        gitleaks git "$REPO" --config "$CONFIG" --gitleaks-ignore-path "$SETTINGS/ignore" \
          --log-opts="$BASE_SHA..$HEAD_SHA" --redact --verbose --no-banner

    - name: Point at the rule for a finding
      if: failure() && steps.scan.outcome == 'failure'
      shell: bash
      run: |
        echo "When the scan reports a secret, apply the first case that matches in [When the scan reports a secret](https://github.com/Jahia/jahia-modules-action/blob/main/secret-scan/README.md#when-the-scan-reports-a-secret)." >> "$GITHUB_STEP_SUMMARY"

    - name: Remove the checkout of the scan
      # A later step of the job would otherwise find a nested repository, and its token, in the workspace.
      if: always()
      shell: bash
      run: rm -rf .secret-scan
