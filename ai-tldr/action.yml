name: AI TL;DR
description: Runs a Claude Code agent from the cortex harness to summarize one issue or pull request, posts the summary as a comment, and removes the requesting label

inputs:
  target_url:
    description: 'URL of the issue or pull request to summarize (the agent derives the repository and number from it)'
    required: true
  github_token:
    description: 'Token used by the agent to read the thread, and by this action to post the comment and remove the label'
    required: true
  cortex_path:
    description: 'Absolute path of the cortex checkout (from ai-agent-setup)'
    required: true
  label:
    description: 'Label that requested the TL;DR — removed once the comment is posted, so the same label can request the next one'
    required: false
    default: '🤖 TL;DR'
  marker:
    description: 'Hidden marker string the agent must put in the comment; the guard reads it to refuse two TL;DRs in a row'
    required: false
    default: '<!-- cortex-tldr -->'
  post_comment:
    description: 'true: post the TL;DR and remove the label; false: review mode — store the would-be comment under logs_dir/comments instead (nothing is posted, the label stays)'
    required: false
    default: 'true'
  debug:
    description: 'Run the Claude Code CLI with --debug: API/CLI-level detail lands in tldr.stderr.log inside the logs artifact'
    required: false
    default: 'false'
  allowed_tools:
    description: 'Claude Code --allowedTools value. Read-only over the forge plus a local file write (the comment file). Summarizing needs no checkout and no code.'
    required: false
    default: 'Read,Write,Grep,Glob,TodoWrite,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue list:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh repo view:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(mkdir:*),Bash(python3 -m json.tool:*)'
  disallowed_tools:
    description: 'Claude Code --disallowedTools value. A deny rule beats an allow rule, including one a repository''s own settings could carry: every way the agent could write to the forge or to code. It reports; posting is this action''s job.'
    required: false
    default: 'Edit,NotebookEdit,MultiEdit,Bash(git push:*),Bash(git commit:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh label:*),Bash(gh release:*),Bash(gh workflow:*),Bash(gh secret:*),Bash(gh api --method POST:*),Bash(gh api --method PATCH:*),Bash(gh api --method PUT:*),Bash(gh api --method DELETE:*),Bash(gh api -X POST:*),Bash(gh api -X PATCH:*),Bash(gh api -X PUT:*),Bash(gh api -X DELETE:*)'

outputs:
  logs_dir:
    description: 'Directory holding the TL;DR run logs (prompt, agent stream, comment) — upload it as an artifact'
    value: ${{ steps.prep.outputs.logs_dir }}

runs:
  using: 'composite'
  steps:
    - name: Prepare the TL;DR prompt and the log directory
      id: prep
      shell: bash
      env:
        TARGET_URL: ${{ inputs.target_url }}
        MARKER: ${{ inputs.marker }}
        POST_COMMENT: ${{ inputs.post_comment }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        AGENT="Claude Code $(claude --version 2>/dev/null | head -1 || echo '(version unknown)')"
        if [ -n "$ANTHROPIC_DEFAULT_SONNET_MODEL" ]; then
          AGENT="$AGENT · model: $ANTHROPIC_DEFAULT_SONNET_MODEL"
        fi
        export AGENT
        LOG_DIR="$RUNNER_TEMP/tldr-logs"
        mkdir -p "$LOG_DIR"
        KEY=$(python3 "$GITHUB_ACTION_PATH/src/build-prompt.py" "$GITHUB_ACTION_PATH/prompt.md" "$LOG_DIR")
        echo "Prepared the TL;DR prompt for $TARGET_URL"
        # Comments posted by this run must be newer than this instant (verification step).
        echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
        echo "logs_dir=$LOG_DIR" >> "$GITHUB_OUTPUT"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"

    - name: Run the TL;DR agent
      shell: bash
      working-directory: ${{ inputs.cortex_path }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        CLAUDE_DEBUG: ${{ inputs.debug }}
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        KEY: ${{ steps.prep.outputs.key }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        {
          echo "### AI TL;DR run"
          echo ""
          echo "| Scope | Outcome | Turns | Duration | Cost (USD) | Exit code |"
          echo "|---|---|---|---|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Summarizing: $KEY"
        # Nothing streams to this log during the run; the trace is printed after it completes.
        echo "::group::Prompt given to the agent"
        cat "$LOG_DIR/tldr.prompt.md"
        echo "::endgroup::"
        STREAM_FILE="$LOG_DIR/tldr.stream.jsonl"
        EXIT_CODE=0
        DEBUG_FLAG=""
        [ "$CLAUDE_DEBUG" = "true" ] && DEBUG_FLAG="--debug"
        # --add-dir: the log dir lives outside the cortex cwd, which Claude Code otherwise refuses
        claude -p "$(cat "$LOG_DIR/tldr.prompt.md")" \
          --allowedTools "$ALLOWED_TOOLS" \
          --disallowedTools "$DISALLOWED_TOOLS" \
          --add-dir "$LOG_DIR" \
          --permission-mode dontAsk \
          --output-format stream-json \
          --verbose $DEBUG_FLAG \
          > "$STREAM_FILE" 2> "$LOG_DIR/tldr.stderr.log" || EXIT_CODE=$?
        python3 "$GITHUB_ACTION_PATH/src/summarize-run.py" "$STREAM_FILE" "$KEY" "$EXIT_CODE"
        # The artifact gets the full human-readable transcript (the console shows the compact trace)
        python3 "$GITHUB_ACTION_PATH/src/render-transcript.py" "$STREAM_FILE" "$LOG_DIR/tldr.transcript.log"
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "::warning::Agent exited with code $EXIT_CODE — the label stays on, so the request can be retried"
        fi

    # The agent only writes the file; posting is deterministic and happens here, outside its
    # permission surface. That is also what makes "the label comes off once a comment exists" true.
    - name: Post the TL;DR comment
      id: post
      if: inputs.post_comment == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MARKER: ${{ inputs.marker }}
        TARGET_URL: ${{ inputs.target_url }}
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        KEY: ${{ steps.prep.outputs.key }}
      run: |
        FILE="$LOG_DIR/comments/$KEY.comment.md"
        if [ ! -s "$FILE" ]; then
          echo "::error::The agent produced no comment file — nothing to post, and the label stays on for a retry"
          exit 1
        fi
        python3 "$GITHUB_ACTION_PATH/src/post-comment.py" post "$FILE" "$TARGET_URL"

    # Only after a comment exists: the label is the retry handle, so it must outlive any failure.
    - name: Remove the requesting label
      if: success() && inputs.post_comment == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        TARGET_URL: ${{ inputs.target_url }}
        LABEL: ${{ inputs.label }}
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3
        script: |
          const [, owner, repo, number] = process.env.TARGET_URL.match(/([^/]+)\/([^/]+)\/(?:issues|pull)\/(\d+)\/?$/)
          try {
            await github.rest.issues.removeLabel({ owner, repo, issue_number: Number(number), name: process.env.LABEL })
            core.info(`Removed the '${process.env.LABEL}' label from ${owner}/${repo}#${number}`)
          } catch (error) {
            // 404 = somebody took it off while the agent was running. Nothing to repair.
            if (error.status === 404) core.info(`The '${process.env.LABEL}' label was already gone`)
            else core.warning(`Could not remove the '${process.env.LABEL}' label: ${error.message}`)
          }

    - name: Publish the stored comment to the job summary
      if: always() && inputs.post_comment != 'true'
      shell: bash
      env:
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
      run: |
        {
          echo "### Review mode — TL;DR that WOULD have been posted"
          echo ""
          for f in "$LOG_DIR"/comments/*.comment.md; do
            [ -e "$f" ] || { echo "_No comment file was produced._"; break; }
            echo "<details><summary>$(basename "$f")</summary>"
            echo ""
            python3 "$GITHUB_ACTION_PATH/src/post-comment.py" render "$f"
            echo ""
            echo "</details>"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify the thread received the TL;DR
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      if: always() && inputs.post_comment == 'true'
      env:
        TARGET_URL: ${{ inputs.target_url }}
        MARKER: ${{ inputs.marker }}
        STARTED_AT: ${{ steps.prep.outputs.started_at }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const [, owner, repo, number] = process.env.TARGET_URL.match(/([^/]+)\/([^/]+)\/(?:issues|pull)\/(\d+)\/?$/)
          const comments = await github.paginate(github.rest.issues.listComments,
            { owner, repo, issue_number: Number(number), per_page: 100 })
          const done = comments.some(c =>
            (c.body ?? '').includes(process.env.MARKER) &&
            new Date(c.created_at) > new Date(process.env.STARTED_AT))
          if (done) core.info(`${process.env.TARGET_URL}: TL;DR posted`)
          else core.warning(`${process.env.TARGET_URL}: NO TL;DR was posted by this run — the label stays on; re-apply it or re-run the job to retry`)
