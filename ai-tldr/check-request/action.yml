name: AI TL;DR — Check request
description: Deterministic (LLM-free) guard deciding whether a TL;DR is owed on an issue or pull request, before any agent instance is started

inputs:
  github_token:
    description: 'Token used to read the item, remove the label and post the cancellation comment'
    required: true
  repository:
    description: 'Repository holding the issue or pull request (owner/repo)'
    required: false
    default: ${{ github.repository }}
  number:
    description: 'Issue or pull-request number (both are issues to the REST API used here)'
    required: true
  label:
    description: 'Label that requests a TL;DR — removed again when the request is refused'
    required: false
    default: '🤖 TL;DR'
  marker:
    description: 'Hidden marker string carried by every TL;DR comment this agent posts'
    required: false
    default: '<!-- cortex-tldr -->'
  lookback:
    description: 'How many of the most recent comments to scan for a previous TL;DR. A TL;DR among them refuses the request.'
    required: false
    default: '3'

outputs:
  eligible:
    description: '"true" when a TL;DR is owed — the item is open, still labelled, and carries no recent TL;DR'
    value: ${{ steps.check.outputs.eligible }}

runs:
  using: 'composite'
  steps:
    # The whole point of this action is to answer before the (expensive) agent instance starts:
    # a duplicate delivery, a re-run, or a label re-applied on top of a fresh TL;DR must all
    # land here as "not eligible" and cost nothing but this job.
    - name: Check a TL;DR is owed
      id: check
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        REPOSITORY: ${{ inputs.repository }}
        NUMBER: ${{ inputs.number }}
        LABEL: ${{ inputs.label }}
        MARKER: ${{ inputs.marker }}
        LOOKBACK: ${{ inputs.lookback }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3
        script: |
          const [owner, repo] = process.env.REPOSITORY.split('/')
          const issue_number = Number(process.env.NUMBER)
          const label = process.env.LABEL
          const marker = process.env.MARKER
          const lookback = Number(process.env.LOOKBACK)

          const { data: item } = await github.rest.issues.get({ owner, repo, issue_number })
          const labelled = (item.labels ?? []).some(l => (l.name ?? l) === label)

          // Refusal splits in two. A stale request (closed, or the label already gone) is not
          // the user's doing, so it passes silently. A too-soon request is, so it gets an answer.
          let stale = ''
          if (item.state !== 'open') stale = `the ${item.pull_request ? 'pull request' : 'issue'} is ${item.state}`
          else if (!labelled) stale = `the '${label}' label is no longer present`

          if (stale) {
            core.setOutput('eligible', 'false')
            core.notice(`${process.env.REPOSITORY}#${issue_number}: skipping TL;DR — ${stale}`)
            return
          }

          // Only the tail matters: an older TL;DR further up the thread is exactly what a new
          // request is asking to refresh.
          const comments = await github.paginate(github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 })
          const recent = comments.slice(-lookback)
          const previous = recent.find(c => (c.body ?? '').includes(marker))

          if (!previous) {
            core.setOutput('eligible', 'true')
            core.info(`${process.env.REPOSITORY}#${issue_number}: TL;DR is owed (${recent.length} recent comment(s) scanned, none is a TL;DR)`)
            return
          }

          core.setOutput('eligible', 'false')
          const position = recent.length - recent.indexOf(previous)
          const ago = position === 1 ? 'as the latest comment' : `${position} comments ago`
          core.notice(`${process.env.REPOSITORY}#${issue_number}: refusing TL;DR — one was posted ${ago}`)

          await github.rest.issues.createComment({
            owner, repo, issue_number,
            body: [
              `🤖 **TL;DR request cancelled** — [one was already posted](${previous.html_url}) ${ago}, so this thread has barely moved since.`,
              '',
              `I removed the \`${label}\` label rather than post a near-identical summary. Add it again once the discussion has advanced, and I'll write a fresh one.`,
              '',
              `<sub>[Run](${process.env.RUN_URL}) · no agent was started, so this cost nothing.</sub>`,
            ].join('\n'),
          })

          // Last: the label must survive long enough for the comment above to explain its removal.
          await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label })
            .catch(e => core.warning(`Could not remove the '${label}' label: ${e.message}`))
