name: Static Analysis
description: Performs static code analysis (linters, security)

inputs:
  primary_release_branch:
    description: 'Primary release branch'
    default: 'main'
  module_path:
    description: 'Path to the module'
    default: './'
  tests_path:
    description: 'Path to the module'
    default: 'tests/'
  max_warning:
    description: 'Maximum number of warning before failing the linting step'
    default: '1'
  auditci_level:
    description: 'Security level to check against for the module codebase, will fail the step if higher'
    default: 'moderate'
  auditci_level_tests:
    description: 'Security level to check against for the tests codebase, will fail the step if higher'
    default: 'critical'
  node_version:
    description: 'Version of node to install on the host. DEPRECATED and ignored when the module has a mise.toml — declare node there instead.'
    default: 'lts/*'
    deprecationMessage: 'Use mise.toml'
  yarn_version:
    description: 'Version of Yarn to use for module. DEPRECATED and ignored when the module has a mise.toml — declare yarn there instead.'
    required: false
    deprecationMessage: 'Use mise.toml'
  yarn_test_version:
    description: 'Version of Yarn to use for tests in module. DEPRECATED and ignored when the module has a mise.toml — declare yarn there instead.'
    required: false
    deprecationMessage: 'Use mise.toml'
  skip_lint_modules:
    description: skip linter for modules when set to true
    type: boolean
    default: false
  skip_lint_tests:
    description: skip linter for tests when set to true
    type: boolean
    default: false
  skip_vulns_modules:
    description: skip Audit-ci for modules when set to true
    type: boolean
    default: false
  skip_vulns_tests:
    description: skip Audit-ci for tests when set to true
    type: boolean
    default: true

runs:
  using: "composite"
  steps:
    # Toolchain: mise.toml is the source of truth when the module has one, it pins both node
    # and yarn. Modules without a mise.toml keep the legacy setup-node path below, which pins
    # node only and leaves yarn to whatever the runner ships.
    # NOTE: this must stay *after* the checkout, hashFiles() reads the working tree, so
    # running it before checkout would always see an empty workspace and pick the fallback.
    # TODO: once every module declares a mise.toml, delete the setup-node step.
    - if: hashFiles('mise.toml') != ''
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

    - if: hashFiles('mise.toml') == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}

    # Install node dependencies
    - name: Run yarn if package.json exists in module folder
      shell: bash
      run: |
        echo "::group::Run yarn if package.json exists in module folder: ${{ inputs.module_path }}"
        if [[ -d "${{ inputs.module_path }}" && -e "${{ inputs.module_path }}package.json" ]]; then
          cd ${{ inputs.module_path }}
          if [[ -n "${{ inputs.yarn_version }}" ]]; then
            if [[ -f "$GITHUB_WORKSPACE/mise.toml" ]]; then
              # 'yarn set version' writes yarnPath into .yarnrc.yml and downloads a
              # .yarn/releases/*.cjs — it would override the version mise just installed.
              echo "::warning::yarn_version='${{ inputs.yarn_version }}' ignored: mise.toml pins yarn for this module"
            else
              yarn set version ${{ inputs.yarn_version }}
            fi
          fi
          yarn
        fi
        echo "::endgroup::"
    - name: Run yarn if package.json exists in tests folder
      shell: bash
      run: |
        echo "::group::Run yarn if package.json exists in tests folder: ${{ inputs.tests_path }}"
        if [[ -d "${{ inputs.tests_path }}" && -e "${{ inputs.tests_path }}package.json" ]]; then
          cd ${{ inputs.tests_path }}
          if [[ -n "${{ inputs.yarn_tests_version }}" ]]; then
            if [[ -f "$GITHUB_WORKSPACE/mise.toml" ]]; then
              echo "::warning::yarn_tests_version='${{ inputs.yarn_tests_version }}' ignored: mise.toml pins yarn for this module"
            else
              yarn set version ${{ inputs.yarn_tests_version }}
            fi
          fi
          yarn
        fi
        echo "::endgroup::"

    # Lint the codebase
    - name: Lint module (javascript only)
      if: ${{ inputs.skip_lint_modules == 'false' }}
      shell: bash
      run: |
        echo "Lint module (javascript only)"      
        if [[ -d "${{ inputs.module_path }}" && -e "${{ inputs.module_path }}package.json" ]]; then
          cd ${{ inputs.module_path }}
          yarn run lint --max-warnings ${{ inputs.max_warning }}
        fi
    - name: Lint tests (javascript only)
      if: ${{ inputs.skip_lint_tests == 'false' }}
      shell: bash
      run: |
        echo "Lint tests (javascript only)"
        if [[ -d "${{ inputs.tests_path }}" && -e "${{ inputs.tests_path }}package.json" ]]; then
          cd ${{ inputs.tests_path }}
          yarn run lint --max-warnings ${{ inputs.max_warning }}
        fi

    # Runs the security checks
    - name: Install audit-ci
      shell: bash
      run: |
        echo "::group::Install audit-ci"     
        echo "Install audit-ci"
        sudo npm install -g audit-ci
        echo "::endgroup::"
    - name: Audit-ci module (javascript only)
      if: ${{ inputs.skip_vulns_modules == 'false' }}
      shell: bash
      run: |
        echo "Scan javascript vulnerabilities in the module with audit-ci"
        if [[ -d "${{ inputs.module_path }}" && -e "${{ inputs.module_path }}package.json" ]]; then
          cd ${{ inputs.module_path }}
          audit-ci --skip-dev --${{ inputs.auditci_level }}
        fi
    - name: Audit-ci tests (javascript only)
      if: ${{ inputs.skip_vulns_tests == 'false' }}
      shell: bash
      run: |
        echo "Scan javascript vulnerabilities in the tests with audit-ci"
        if [[ -d "${{ inputs.tests_path }}" && -e "${{ inputs.tests_path }}package.json" ]]; then
          cd ${{ inputs.tests_path }}
          audit-ci --${{ inputs.auditci_level_tests }}
        fi
        echo "::endgroup::"
