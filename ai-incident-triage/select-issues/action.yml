name: Select incident issues for triage
description: Deterministically selects open automated-incident issues, across all repositories in scope, whose latest failure has not yet been analyzed by the triage agent

inputs:
  github_token:
    description: 'Token used to search issues and list comments (must have access to every repository in scope)'
    required: true
  search_scope:
    description: 'GitHub issue-search scope qualifier, e.g. "org:Jahia" or "repo:Jahia/sandbox"'
    required: false
    default: 'org:Jahia'
  label:
    description: 'Label identifying automated test-failure incidents'
    required: false
    default: 'automated-incident'
  marker:
    description: 'Hidden marker string identifying agent triage comments'
    required: false
    default: '<!-- cortex-incident-triage -->'

outputs:
  issues:
    description: 'JSON array of eligible issues ({repository, number, title, html_url, latest_failure_at, source_run_url, vpn_artifacts_url})'
    value: ${{ steps.select.outputs.result }}
  has_issues:
    description: '"true" when at least one issue is eligible'
    value: ${{ steps.select.outputs.result != '[]' }}

runs:
  using: 'composite'
  steps:
    - name: Select eligible issues
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      id: select
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3
        script: |
          const select = require(`${process.env.GITHUB_ACTION_PATH}/src/select-issues.js`)
          return await select({github, core}, {
            searchScope: '${{ inputs.search_scope }}',
            label: '${{ inputs.label }}',
            marker: '${{ inputs.marker }}',
          })
