name: AI Incident Triage
description: Runs a Claude Code agent from the cortex harness to analyze automated-incident issues and post a triage comment on each

inputs:
  issues:
    description: 'JSON array of issues produced by the select-issues action (each item carries its own repository)'
    required: true
  github_token:
    description: 'Token used by the agent to read issues/runs and post comments'
    required: true
  cortex_path:
    description: 'Absolute path of the cortex checkout (from ai-agent-setup)'
    required: true
  marker:
    description: 'Hidden marker string the agent must put in every triage comment'
    required: false
    default: '<!-- cortex-incident-triage -->'
  allowed_tools:
    description: 'Claude Code --allowedTools value for the agent (analysis-only: no Edit/Write/push surface)'
    required: false
    default: 'Read,Grep,Glob,Skill,TodoWrite,WebFetch,Bash(gh issue view *),Bash(gh issue comment *),Bash(gh run view *),Bash(gh run download *),Bash(gh api *),Bash(tools/jahia-ci-triage/bin/jahia-ci-triage *),Bash(curl *),Bash(wget *),Bash(unzip *),Bash(ls *),Bash(cat *),Bash(mkdir *),Bash(python3 *)'

outputs:
  logs_dir:
    description: 'Directory holding all triage run logs (prompts, agent streams, results) — upload it as an artifact'
    value: ${{ steps.prep.outputs.logs_dir }}

runs:
  using: 'composite'
  steps:
    - name: Prepare per-issue prompts and the log directory
      id: prep
      shell: bash
      env:
        ISSUES_JSON: ${{ inputs.issues }}
        MARKER: ${{ inputs.marker }}
      run: |
        LOG_DIR="$RUNNER_TEMP/triage-logs"
        mkdir -p "$LOG_DIR"
        ISSUE_KEYS=$(python3 "$GITHUB_ACTION_PATH/src/build-prompts.py" "$GITHUB_ACTION_PATH/prompt.md" "$LOG_DIR")
        echo "Prepared prompts for issue(s): $ISSUE_KEYS"
        echo "logs_dir=$LOG_DIR" >> "$GITHUB_OUTPUT"
        echo "issue_keys=$ISSUE_KEYS" >> "$GITHUB_OUTPUT"

    - name: Run the triage agent, one invocation per issue
      shell: bash
      working-directory: ${{ inputs.cortex_path }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        ISSUE_KEYS: ${{ steps.prep.outputs.issue_keys }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        {
          echo "### Triage runs"
          echo ""
          echo "| Issue | Outcome | Turns | Duration | Cost (USD) | Exit code |"
          echo "|---|---|---|---|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        FAILURES=0
        for KEY in $ISSUE_KEYS; do
          echo "::group::Triage issue $KEY"
          STREAM_FILE="$LOG_DIR/issue-$KEY.stream.jsonl"
          EXIT_CODE=0
          claude -p "$(cat "$LOG_DIR/prompts/issue-$KEY.prompt.md")" \
            --allowedTools "$ALLOWED_TOOLS" \
            --permission-mode dontAsk \
            --output-format stream-json \
            --verbose \
            > "$STREAM_FILE" 2> "$LOG_DIR/issue-$KEY.stderr.log" || EXIT_CODE=$?
          python3 "$GITHUB_ACTION_PATH/src/summarize-run.py" "$STREAM_FILE" "$KEY" "$EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Issue $KEY: agent exited with code $EXIT_CODE — the issue stays eligible and will be retried on the next run"
            FAILURES=$((FAILURES + 1))
          fi
          echo "::endgroup::"
        done
        echo "Triage loop finished with $FAILURES failed agent run(s)"

    - name: Verify each issue received a triage comment
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      if: always()
      env:
        ISSUES_JSON: ${{ inputs.issues }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const issues = JSON.parse(process.env.ISSUES_JSON)
          for (const issue of issues) {
            const [owner, repo] = issue.repository.split('/')
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number: issue.number, per_page: 100})
            const done = comments.some(c =>
              (c.body ?? '').includes('${{ inputs.marker }}') &&
              new Date(c.created_at) > new Date(issue.latest_failure_at))
            if (done) core.info(`${issue.repository}#${issue.number}: triage comment present`)
            else core.warning(`${issue.repository}#${issue.number}: NO triage comment was posted — it stays eligible and will be retried on the next run`)
          }
