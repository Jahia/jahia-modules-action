name: AI Incident Triage
description: Runs a Claude Code agent from the cortex harness to analyze Jahia integration-test failures — either automated-incident issues (posting a triage comment on each) or the integration-tests run that just finished in the same job (writing its analysis to the job summary)

inputs:
  # --- Issues mode: triage automated-incident issues (the nightly, centralized run) ---
  issues:
    description: 'Issues mode: JSON array of issues produced by the select-issues action (each item carries its own repository). Leave empty to use run mode.'
    required: false
    default: ''
  # --- Run mode: analyze the integration-tests run that just finished in this job ---
  artifacts_path:
    description: 'Run mode: folder exported by the integration-tests action (holds results/ with the Cypress, Jahia and container logs). Setting it switches the action to run mode: the agent analyzes these artifacts, answers "why did the tests fail" (or "did anything unexpected happen" on a green run) and writes a human-readable report to the job summary. Nothing is posted anywhere.'
    required: false
    default: ''
  module_id:
    description: 'Run mode: id of the tested module, named in the report'
    required: false
    default: ''
  tests_outcome:
    description: 'Run mode: outcome of the integration-tests step as GitHub saw it (steps.<id>.outcome — success or failure)'
    required: false
    default: ''
  # --- Both modes ---
  github_token:
    description: 'Token used by the agent to read issues/runs and, in issues mode, post comments'
    required: true
  cortex_path:
    description: 'Absolute path of the cortex checkout (from ai-agent-setup)'
    required: true
  marker:
    description: 'Hidden marker string the agent must put in every triage comment'
    required: false
    default: '<!-- cortex-incident-triage -->'
  post_comments:
    description: 'true: post the triage comment on each issue; false: review mode — store the would-be comments under logs_dir/comments instead (nothing is posted, issues stay eligible)'
    required: false
    default: 'true'
  allowed_tools:
    description: 'Claude Code --allowedTools value for the agent (analysis-only: no Edit/Write/push surface)'
    required: false
    default: 'Read,Write,Grep,Glob,Skill,TodoWrite,WebFetch,Bash(gh issue view *),Bash(gh issue comment *),Bash(gh run view *),Bash(gh run download *),Bash(gh api *),Bash(tools/jahia-ci-triage/bin/jahia-ci-triage *),Bash(curl *),Bash(wget *),Bash(unzip *),Bash(ls *),Bash(cat *),Bash(mkdir *),Bash(python3 *)'

outputs:
  logs_dir:
    description: 'Directory holding all agent run logs (prompt, agent stream, result, and in run mode the report) — upload it as an artifact'
    value: ${{ steps.prep.outputs.logs_dir }}
  report_file:
    description: 'Run mode: path of the markdown report the agent wrote (also appended to the job summary)'
    value: ${{ steps.prep.outputs.report_file }}

runs:
  using: 'composite'
  steps:
    - name: Prepare the prompt and the log directory
      id: prep
      shell: bash
      env:
        ISSUES_JSON: ${{ inputs.issues }}
        ARTIFACTS_PATH: ${{ inputs.artifacts_path }}
        MODULE_ID: ${{ inputs.module_id }}
        TESTS_OUTCOME: ${{ inputs.tests_outcome }}
        WORKSPACE: ${{ github.workspace }}
        REPOSITORY: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        MARKER: ${{ inputs.marker }}
        POST_COMMENTS: ${{ inputs.post_comments }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -n "$ARTIFACTS_PATH" ]; then
          MODE=run; TEMPLATE="$GITHUB_ACTION_PATH/prompt-run.md"
        elif [ -n "$ISSUES_JSON" ]; then
          MODE=issues; TEMPLATE="$GITHUB_ACTION_PATH/prompt.md"
        else
          echo "::error::Either 'issues' (issues mode) or 'artifacts_path' (run mode) must be provided"
          exit 1
        fi
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        export PATH="$HOME/.local/bin:$PATH"
        AGENT="Claude Code $(claude --version 2>/dev/null | head -1 || echo '(version unknown)')"
        if [ -n "$ANTHROPIC_DEFAULT_SONNET_MODEL" ]; then
          AGENT="$AGENT · model: $ANTHROPIC_DEFAULT_SONNET_MODEL"
        fi
        export AGENT
        LOG_DIR="$RUNNER_TEMP/triage-logs"
        mkdir -p "$LOG_DIR"
        ISSUE_KEYS=$(python3 "$GITHUB_ACTION_PATH/src/build-prompts.py" "$TEMPLATE" "$LOG_DIR")
        echo "Prepared the $MODE-mode prompt for: $ISSUE_KEYS"
        echo "logs_dir=$LOG_DIR" >> "$GITHUB_OUTPUT"
        echo "issue_keys=$ISSUE_KEYS" >> "$GITHUB_OUTPUT"
        echo "report_file=$LOG_DIR/analysis/run-analysis.md" >> "$GITHUB_OUTPUT"

    # Issues mode: one invocation over ALL issues, deliberately — seeing the whole selection
    # lets the agent correlate failures across repositories and spot shared root causes.
    # Run mode: one invocation over the run's artifacts on disk.
    - name: Run the analysis agent
      shell: bash
      working-directory: ${{ inputs.cortex_path }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MODE: ${{ steps.prep.outputs.mode }}
        # The CI-run restart (transient-infrastructure signatures) is only permitted when the
        # agent acts for real on issues; review mode and run mode stay strictly observational.
        ALLOWED_TOOLS: ${{ steps.prep.outputs.mode == 'issues' && inputs.post_comments == 'true' && format('{0},Bash(gh run rerun *)', inputs.allowed_tools) || inputs.allowed_tools }}
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        ISSUE_KEYS: ${{ steps.prep.outputs.issue_keys }}
        ARTIFACTS_PATH: ${{ inputs.artifacts_path }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        {
          echo "### Agent run"
          echo ""
          echo "| Scope | Outcome | Turns | Duration | Cost (USD) | Exit code |"
          echo "|---|---|---|---|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Analyzing in one agent run ($MODE mode): $ISSUE_KEYS"
        # Run mode never reaches the forge: a deny rule beats the allowlist, including the
        # issue-comment verb the issues mode needs. The artifacts folder lives outside the
        # cortex cwd, so it is added the same way the log dir is.
        EXTRA_ARGS=()
        if [ "$MODE" = "run" ]; then
          EXTRA_ARGS+=(--add-dir "$ARTIFACTS_PATH" --disallowedTools "Bash(gh issue comment *),Bash(gh run rerun *)")
        fi
        # Model responses are not streamed to this log, so show upfront what the agent was
        # asked to do; the full action trace is printed after the run completes.
        echo "::group::Prompt given to the agent"
        cat "$LOG_DIR/triage.prompt.md"
        echo "::endgroup::"
        STREAM_FILE="$LOG_DIR/triage.stream.jsonl"
        EXIT_CODE=0
        # --add-dir: the log dir lives outside the cortex working directory, and Claude Code
        # refuses writes outside its sanctioned directories (review-mode comment files land there).
        claude -p "$(cat "$LOG_DIR/triage.prompt.md")" \
          --allowedTools "$ALLOWED_TOOLS" \
          --add-dir "$LOG_DIR" "${EXTRA_ARGS[@]}" \
          --permission-mode dontAsk \
          --output-format stream-json \
          --verbose \
          > "$STREAM_FILE" 2> "$LOG_DIR/triage.stderr.log" || EXIT_CODE=$?
        LABEL="all issues"; [ "$MODE" = "run" ] && LABEL="run"
        python3 "$GITHUB_ACTION_PATH/src/summarize-run.py" "$STREAM_FILE" "$LABEL" "$EXIT_CODE"
        if [ "$EXIT_CODE" -ne 0 ] && [ "$MODE" = "issues" ]; then
          echo "::warning::Agent exited with code $EXIT_CODE — unreported issues stay eligible and will be retried on the next run"
        elif [ "$EXIT_CODE" -ne 0 ]; then
          echo "::warning::Agent exited with code $EXIT_CODE — the run analysis may be missing or partial"
        fi

    # Run mode delivers here: the report is the job summary, readable from the run page.
    - name: Publish the run analysis to the job summary
      if: always() && steps.prep.outputs.mode == 'run'
      shell: bash
      env:
        REPORT_FILE: ${{ steps.prep.outputs.report_file }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          if [ -s "$REPORT_FILE" ]; then
            cat "$REPORT_FILE"
          else
            echo "## 🤖 AI analysis of the integration tests run"
            echo ""
            echo "_The agent produced no report — see the agent trace in the [run log]($RUN_URL) and the analysis logs artifact._"
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        [ -s "$REPORT_FILE" ] || echo "::warning::The agent produced no run analysis report"

    - name: Publish the stored review comments to the job summary
      if: always() && steps.prep.outputs.mode == 'issues' && inputs.post_comments != 'true'
      shell: bash
      env:
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
      run: |
        {
          echo "### Review mode — comments that WOULD have been posted"
          echo ""
          for f in "$LOG_DIR"/comments/*.comment.md; do
            [ -e "$f" ] || { echo "_No comment files were produced._"; break; }
            echo "<details><summary>$(basename "$f")</summary>"
            echo ""
            cat "$f"
            echo ""
            echo "</details>"
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify each issue received a triage comment
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      if: always() && steps.prep.outputs.mode == 'issues' && inputs.post_comments == 'true'
      env:
        ISSUES_JSON: ${{ inputs.issues }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const issues = JSON.parse(process.env.ISSUES_JSON)
          for (const issue of issues) {
            const [owner, repo] = issue.repository.split('/')
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number: issue.number, per_page: 100})
            const done = comments.some(c =>
              (c.body ?? '').includes('${{ inputs.marker }}') &&
              new Date(c.created_at) > new Date(issue.latest_failure_at))
            if (done) core.info(`${issue.repository}#${issue.number}: triage comment present`)
            else core.warning(`${issue.repository}#${issue.number}: NO triage comment was posted — it stays eligible and will be retried on the next run`)
          }
