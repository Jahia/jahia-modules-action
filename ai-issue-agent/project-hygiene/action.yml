name: AI Issue Agent — Project hygiene
description: Ensures the issue an agent session works on is attached to the delivery board with Priority set, Status truthful and a default Squad when none is set. Idempotent — safe to run at every session start. Fails loud (naming the board's actual fields/options) when the board does not match.

inputs:
  github_token:
    description: 'Token used to read the issue and write the ProjectsV2 item — it MUST carry organization project scope (the chores token the add-to-project jobs already use does).'
    required: true
  repository:
    description: 'Repository holding the issue (owner/repo)'
    required: false
    default: ${{ github.repository }}
  issue_number:
    description: 'Number of the issue to put on the board'
    required: true
  project_url:
    description: 'URL of the organization project to attach the issue to'
    required: false
    default: 'https://github.com/orgs/Jahia/projects/50'
  status:
    description: 'Value for the Status single-select field (for example "In Progress"). Empty leaves Status untouched.'
    required: false
    default: ''
  priority:
    description: 'Value the Priority single-select field is set to, every time'
    required: false
    default: 'Now'
  squad_default:
    description: 'Value the Squad single-select field gets ONLY when it is not set yet — an already-assigned squad is never overwritten'
    required: false
    default: '🐐 GOAT'

outputs:
  item_id:
    description: 'ProjectsV2 item id of the issue on the board'

runs:
  using: 'node24'
  main: 'dist/index.js'
