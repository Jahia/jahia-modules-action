name: Select bugs for the PM score
description: Deterministically selects the open issues of type Bug, across the search scope, whose PM Score issue field is empty

inputs:
  github_token:
    description: 'Token able to search the issues of the scope and read their issue fields'
    required: true
  org:
    description: 'Organization that owns the issue field'
    required: false
    default: 'Jahia'
  search_scope:
    description: 'GitHub issue-search scope qualifier, e.g. "org:Jahia" or "repo:Jahia/sandbox"'
    required: false
    default: 'org:Jahia'
  field:
    description: 'Name of the organization number issue field that holds the score'
    required: false
    default: 'PM Score'
  max_bugs:
    description: 'Most bugs scored in one run; the next run takes the rest'
    required: false
    default: '30'

outputs:
  bugs:
    description: 'JSON array of the selected bugs ({key, repository, number, url, field_id}), sorted by repository and number'
    value: ${{ steps.select.outputs.result }}
  has_bugs:
    description: '"true" when at least one bug is selected'
    value: ${{ steps.select.outputs.result != '[]' }}

runs:
  using: 'composite'
  steps:
    - name: Select the bugs with no score
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      id: select
      env:
        ORG: ${{ inputs.org }}
        SEARCH_SCOPE: ${{ inputs.search_scope }}
        FIELD: ${{ inputs.field }}
        MAX_BUGS: ${{ inputs.max_bugs }}
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3
        script: |
          const select = require(`${process.env.GITHUB_ACTION_PATH}/src/select-bugs.js`)
          const env = process.env
          return await select({github, core}, {
            org: env.ORG,
            searchScope: env.SEARCH_SCOPE,
            field: env.FIELD,
            maxBugs: Number(env.MAX_BUGS),
          })
