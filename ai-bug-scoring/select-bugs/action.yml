name: Select bugs for the PM score
description: Deterministically selects the open bugs whose PM score field is empty, on the triage board and on the delivery board

inputs:
  github_token:
    description: 'Token able to read both organization projects'
    required: true
  org:
    description: 'Organization that owns both boards'
    required: false
    default: 'Jahia'
  triage_board:
    description: 'Number of the triage board'
    required: false
    default: '13'
  triage_filter:
    description: 'Board filter of the bugs that wait in triage'
    required: false
    default: 'status:"Triage needed" type:Bug'
  triage_field:
    description: 'Number field of the triage board that holds the score'
    required: false
    default: 'PM score (for triage)'
  delivery_board:
    description: 'Number of the delivery board'
    required: false
    default: '50'
  delivery_filter:
    description: 'Board filter of the bugs that wait for the PM decision'
    required: false
    default: 'priority:"For Decision" -status:Done type:Bug'
  delivery_field:
    description: 'Number field of the delivery board that holds the score'
    required: false
    default: 'PM score (bugs)'
  max_bugs:
    description: 'Most bugs scored in one run; the next run takes the rest'
    required: false
    default: '30'

outputs:
  bugs:
    description: 'JSON array of the selected bugs ({key, repository, number, url, targets: [{board, project_id, item_id, field_id, field}]})'
    value: ${{ steps.select.outputs.result }}
  has_bugs:
    description: '"true" when at least one bug is selected'
    value: ${{ steps.select.outputs.result != '[]' }}

runs:
  using: 'composite'
  steps:
    - name: Select the bugs with no score
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      id: select
      env:
        ORG: ${{ inputs.org }}
        TRIAGE_BOARD: ${{ inputs.triage_board }}
        TRIAGE_FILTER: ${{ inputs.triage_filter }}
        TRIAGE_FIELD: ${{ inputs.triage_field }}
        DELIVERY_BOARD: ${{ inputs.delivery_board }}
        DELIVERY_FILTER: ${{ inputs.delivery_filter }}
        DELIVERY_FIELD: ${{ inputs.delivery_field }}
        MAX_BUGS: ${{ inputs.max_bugs }}
      with:
        github-token: ${{ inputs.github_token }}
        retries: 3
        script: |
          const select = require(`${process.env.GITHUB_ACTION_PATH}/src/select-bugs.js`)
          const env = process.env
          return await select({github, core}, {
            org: env.ORG,
            boards: [
              {board: Number(env.TRIAGE_BOARD), filter: env.TRIAGE_FILTER, field: env.TRIAGE_FIELD},
              {board: Number(env.DELIVERY_BOARD), filter: env.DELIVERY_FILTER, field: env.DELIVERY_FIELD},
            ],
            maxBugs: Number(env.MAX_BUGS),
          })
