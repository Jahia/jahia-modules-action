name: AI Bug Scoring
description: Runs a Claude Code agent to record the PM score factors of each selected bug, then scores them with system A2 and writes the PM Score issue field and a breakdown comment

inputs:
  bugs:
    description: 'JSON array of bugs produced by the select-bugs action'
    required: true
  github_token:
    description: 'Token that reads the issues and posts the score comments'
    required: true
  field_token:
    description: 'Token that writes the PM Score issue field (push access to every selected repository)'
    required: true
  model:
    description: 'Model the agent runs on, passed to the Claude Code CLI as --model: an alias the gateway maps (`opus`, `sonnet`, `haiku`) or a model name it serves verbatim. Empty means no --model at all. The factors are judgment calls that the rubric was calibrated on with an Opus model, so the default is opus.'
    required: false
    default: 'opus'
  dry_run:
    description: 'true: run the agent but write nothing — store the would-be comments under logs_dir/comments instead; false: write the field and post the comments'
    required: false
    default: 'false'
  cortex_path:
    description: 'Absolute path of the cortex checkout (from ai-agent-setup), whose jahia-pm-bug-scoring skill holds the rubric'
    required: true
  marker:
    description: 'Hidden marker that opens every score comment'
    required: false
    default: '<!-- ai-bug-scoring -->'
  batch_size:
    description: 'Tickets per agent run; each run starts with a fresh context'
    required: false
    default: '10'

outputs:
  logs_dir:
    description: 'Directory holding the run logs (tickets, prompts, agent streams, factors, results) — upload it as an artifact'
    value: ${{ steps.prep.outputs.logs_dir }}

runs:
  using: 'composite'
  steps:
    # A self-hosted runner guarantees no `node` on PATH — this step's own Node is the one the
    # bundled scripts (dist/*) run on.
    - name: Resolve the Node runtime
      id: node
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: core.setOutput('bin', process.execPath)

    # The rubric and the tickets land in the log directory, one prompt per batch, so the agent
    # needs no network and no GitHub token.
    - name: Copy the rubric, fetch the tickets, prepare the prompts
      id: prep
      shell: bash
      env:
        BUGS_JSON: ${{ inputs.bugs }}
        MARKER: ${{ inputs.marker }}
        GH_TOKEN: ${{ inputs.github_token }}
        BATCH_SIZE: ${{ inputs.batch_size }}
        CORTEX_PATH: ${{ inputs.cortex_path }}
      run: |
        "${{ steps.node.outputs.bin }}" "$GITHUB_ACTION_PATH/dist/prepare/index.js"

    - name: Record the factors with the agent
      shell: bash
      working-directory: ${{ steps.prep.outputs.logs_dir }}
      env:
        AGENT_MODEL: ${{ inputs.model }}
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        BATCHES: ${{ steps.prep.outputs.batches }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        # The agent reads under LOG_DIR and writes only the factors files: no shell, no network,
        # no GitHub token. A leading // makes a path rule absolute.
        ALLOWED_TOOLS="Read(/$LOG_DIR/**),Edit(/$LOG_DIR/factors/**)"
        MODEL_FLAG=""
        [ -n "$AGENT_MODEL" ] && MODEL_FLAG="--model $AGENT_MODEL"
        {
          echo "### Agent runs"
          echo ""
          echo "| Scope | Outcome | Turns | Duration | Cost (USD) | Exit code |"
          echo "|---|---|---|---|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"
        for n in $(seq 1 "$BATCHES"); do
          STREAM_FILE="$LOG_DIR/batch-$n.stream.jsonl"
          EXIT_CODE=0
          claude -p "$(cat "$LOG_DIR/batch-$n.prompt.md")" \
            --allowedTools "$ALLOWED_TOOLS" \
            --permission-mode dontAsk \
            --output-format stream-json \
            --verbose $MODEL_FLAG ${CORTEX_MASK_MOD_DIR:+--plugin-dir "$CORTEX_MASK_MOD_DIR"} \
            > "$STREAM_FILE" 2> "$LOG_DIR/batch-$n.stderr.log" || EXIT_CODE=$?
          "${{ steps.node.outputs.bin }}" "$GITHUB_ACTION_PATH/dist/summarize-run/index.js" "$STREAM_FILE" "batch $n" "$EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Agent run $n exited with code $EXIT_CODE — its bugs with no factors stay unscored and the next run tries them again"
          fi
        done

    - name: Score the bugs and write the results
      shell: bash
      env:
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
        DRY_RUN: ${{ inputs.dry_run }}
        MARKER: ${{ inputs.marker }}
        AGENT_MODEL: ${{ inputs.model }}
        GH_TOKEN: ${{ inputs.github_token }}
        FIELD_TOKEN: ${{ inputs.field_token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        AGENT="Claude Code $(claude --version 2>/dev/null | head -1 || echo '(version unknown)')"
        # Name the model that answers, not the alias asked for.
        case "$AGENT_MODEL" in
          opus)   MODEL_LABEL="${ANTHROPIC_DEFAULT_OPUS_MODEL:-$AGENT_MODEL}" ;;
          sonnet) MODEL_LABEL="${ANTHROPIC_DEFAULT_SONNET_MODEL:-$AGENT_MODEL}" ;;
          haiku)  MODEL_LABEL="${ANTHROPIC_DEFAULT_HAIKU_MODEL:-$AGENT_MODEL}" ;;
          *)      MODEL_LABEL="$AGENT_MODEL" ;;
        esac
        [ -n "$MODEL_LABEL" ] && AGENT="$AGENT · model: $MODEL_LABEL"
        export AGENT
        "${{ steps.node.outputs.bin }}" "$GITHUB_ACTION_PATH/dist/apply-scores/index.js"

    - name: Publish the stored comments to the job summary
      if: always() && inputs.dry_run == 'true'
      shell: bash
      env:
        LOG_DIR: ${{ steps.prep.outputs.logs_dir }}
      run: |
        {
          echo "### Dry run — comments that WOULD have been posted"
          echo ""
          for f in "$LOG_DIR"/comments/*.comment.md; do
            [ -e "$f" ] || { echo "_No comment files were produced._"; break; }
            echo "<details><summary>$(basename "$f")</summary>"
            echo ""
            cat "$f"
            echo ""
            echo "</details>"
          done
        } >> "$GITHUB_STEP_SUMMARY"
