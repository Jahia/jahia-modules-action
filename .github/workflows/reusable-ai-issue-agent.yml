# On-demand agent session on a GitHub issue: mentioning the AI agent account in a fresh
# issue comment (`@jahia-ai do something`) starts one bounded session working that issue,
# with the whole issue as context. Assigning the account triggers nothing. The guard
# reacts 👍 on the triggering comment once the session is admitted.
#
# Trigger filtering (which event, which account) belongs to the caller, typically
# reusable-delivery-issue-chores.yml. Two jobs, deliberately: a cheap LLM-free guard on
# ubuntu-slim owns eligibility — the trigger filter, the single-agent lock and the issue's
# cumulative runtime budget — and only then does an agent instance start. A duplicate
# trigger, a re-run or an exhausted budget all land on the guard and cost nothing more.
# State, lock and ledger live in the issue's overall-status comment: ai-issue-agent/README.md.
#
# The agent job runs a real Claude Code session (cortex harness, LiteLLM through the IT
# mTLS bastion): pre-fetched issue context, a barebone prompt whose substance lives in
# cortex skills, one task comment per session through the issue-agent tool, and a logs
# artifact. The session budget is the smaller of the job timeout and what remains of the
# issue's cumulative budget.
name: AI Issue Agent

on:
  workflow_call:
    inputs:
      agent_login:
        description: "GitHub username of the AI agent account (only fresh issue comments mentioning this login qualify)"
        type: string
        required: false
        default: "jahia-ai"
      instance_type:
        description: "Type of instances to run the agent job on"
        type: string
        required: false
        default: "self-hosted"
      timeout_job:
        description: "Timeout (in minutes) of the agent job. Also feeds the guard's stale-lock rule."
        type: number
        required: false
        default: 30
      budget_seconds:
        description: "Cumulative agent-runtime budget for one issue, across all sessions (fixed on the issue's first session)"
        type: number
        required: false
        default: 7200
      project_url:
        description: "Organization project the issue is attached to at session start (board hygiene)"
        type: string
        required: false
        default: "https://github.com/orgs/Jahia/projects/50"
      status_on_start:
        description: "Value the board's Status field takes when a session starts (empty leaves Status untouched)"
        type: string
        required: false
        default: "In Progress"
      model:
        description: "Model the agent will run on (an `opus`/`sonnet`/`haiku` alias the LiteLLM gateway maps, or a model name it serves verbatim)."
        type: string
        required: false
        default: "opus"
      cortex_ref:
        description: "Git ref of the cortex harness to use."
        type: string
        required: false
        default: "main"
      claude_code_version:
        description: "Claude Code CLI version to install."
        type: string
        required: false
        default: "stable"
      tunnel_hosts:
        description: "Internal hosts to reach through the mTLS tunnel (space-separated); must be allowlisted on IT's side."
        type: string
        required: false
        default: "litellm-prod.int.jahia.com"
      debug:
        description: "Run the agent with debug detail in the logs."
        type: boolean
        required: false
        default: false

jobs:
  # Cheap LLM-free guard: trigger filter, single-agent lock, budget ledger. The concurrency
  # group is the actual mutual exclusion — one guard at a time per issue — and the lock it
  # writes into the status comment is that mutex's durable record between runs.
  check-request:
    name: Check an agent session is owed
    runs-on: ubuntu-slim
    concurrency:
      group: ai-issue-agent-guard-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      remaining_seconds: ${{ steps.check.outputs.remaining_seconds }}
      session_index: ${{ steps.check.outputs.session_index }}
      trigger: ${{ steps.check.outputs.trigger }}
    steps:
      - id: check
        uses: jahia/jahia-modules-action/ai-issue-agent/check-request@v2
        with:
          github_token: ${{ secrets.AI_AGENT_GH_ISSUES_PRS_CHORES }}
          issue_number: ${{ github.event.issue.number }}
          agent_login: ${{ inputs.agent_login }}
          budget_seconds: ${{ inputs.budget_seconds }}
          timeout_job: ${{ inputs.timeout_job }}

  # No concurrency group here, on purpose: the guard's lock already guarantees one session
  # per issue, and an Actions group would QUEUE a duplicate instead of preventing it.
  agent:
    name: Run the agent session
    needs: check-request
    if: needs.check-request.outputs.eligible == 'true'
    runs-on: ${{ inputs.instance_type }}
    timeout-minutes: ${{ inputs.timeout_job }}
    permissions:
      id-token: write
      contents: read
    steps:
      # The ledger bills the session from this instant: runner queue time is free,
      # everything from here to finalize is not.
      - name: Stamp the session start
        id: session
        shell: bash
        run: |
          echo "started_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          # The QA-server artifact folder is named HERE, not at upload time: the agent's
          # comment footer links it from the session's first comment, hours before the
          # upload exists, and a run crossing midnight must not break that link. The
          # delete-on-<date> prefix drives the QA server's cleanup (upload-artifact uses
          # the name verbatim when it carries the prefix); the date matches the upload
          # step's retention-days.
          ARTIFACTS_EXPIRY=$(date -u -d "+30 days" +%Y-%m-%d)
          ARTIFACTS_NAME="delete-on-${ARTIFACTS_EXPIRY}_$(echo "$GITHUB_REPOSITORY" | sed 's#/#_#g')_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "artifacts_expiry=$ARTIFACTS_EXPIRY" >> "$GITHUB_OUTPUT"
          echo "artifacts_name=$ARTIFACTS_NAME" >> "$GITHUB_OUTPUT"
          echo "artifacts_url=https://qa.jahia.com/artifacts-ci/${ARTIFACTS_NAME}/" >> "$GITHUB_OUTPUT"

      # Board hygiene: the issue the session works on is always on the delivery board,
      # prioritized, truthfully statused, with a default squad when none is set.
      # GH_ISSUES_PRS_CHORES is the token the other chores jobs already use against this
      # project. continue-on-error: a board mismatch is an annotation to fix, never a
      # reason to lose the session.
      - name: Project hygiene — the delivery board reflects this session
        continue-on-error: true
        uses: jahia/jahia-modules-action/ai-issue-agent/project-hygiene@v2
        with:
          github_token: ${{ secrets.GH_ISSUES_PRS_CHORES }}
          issue_number: ${{ github.event.issue.number }}
          project_url: ${{ inputs.project_url }}
          status: ${{ inputs.status_on_start }}

      - name: Open the mTLS tunnel to internal Jahia services
        uses: jahia/jahia-modules-action/mtls-tunnel@v2
        with:
          hosts: ${{ inputs.tunnel_hosts }}
          ca-url: ${{ vars.INFRAJAHIA_MTLS_CA_URL }}
          bastion: ${{ vars.INFRAJAHIA_MTLS_BASTION }}
          server-name: ci-egress.jahia.com
          audience: jahia-ci-egress
          step-root: ${{ secrets.INFRAJAHIA_MTLS_STEP_ROOT }}
          server-ca: ${{ secrets.INFRAJAHIA_MTLS_SERVER_CA }}
          canary-url: ${{ vars.AI_LITELLM_BASE_URL }}/health/liveliness

      - name: Set up Claude Code and the cortex harness
        id: setup
        uses: jahia/jahia-modules-action/ai-agent-setup@v2
        with:
          claude_code_version: ${{ inputs.claude_code_version }}
          anthropic_base_url: ${{ vars.AI_LITELLM_BASE_URL }}
          anthropic_auth_token: ${{ secrets.AI_LITELLM_AUTH_TOKEN_USAGE_PRS }}
          default_opus_model: ${{ vars.AI_LITELLM_ANTHROPIC_DEFAULT_OPUS_MODEL }}
          default_sonnet_model: ${{ vars.AI_LITELLM_ANTHROPIC_DEFAULT_SONNET_MODEL }}
          default_haiku_model: ${{ vars.AI_LITELLM_ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          cortex_ref: ${{ inputs.cortex_ref }}
          cortex_telemetry_token: ${{ secrets.CORTEX_TELEMETRY_TOKEN }}
          github_token: ${{ secrets.AI_AGENT_GH_ISSUES_PRS_CHORES }}

      - name: Run the agent session
        id: run
        uses: jahia/jahia-modules-action/ai-issue-agent/run@v2
        with:
          issue_url: ${{ github.event.issue.html_url }}
          github_token: ${{ secrets.AI_AGENT_GH_ISSUES_PRS_CHORES }}
          cortex_path: ${{ steps.setup.outputs.cortex_path }}
          model: ${{ inputs.model }}
          agent_login: ${{ inputs.agent_login }}
          remaining_seconds: ${{ needs.check-request.outputs.remaining_seconds }}
          session_index: ${{ needs.check-request.outputs.session_index }}
          # The action stops the agent a few minutes before this budget is up, so the
          # artifact uploads below still run with time to spare. The reserve is subtracted
          # inside the action: GitHub Actions expressions have no arithmetic operators.
          job_timeout_minutes: ${{ inputs.timeout_job }}
          debug: ${{ inputs.debug }}
          jahia_artifacts_url: ${{ steps.session.outputs.artifacts_url }}
          jahia_artifacts_expiry: ${{ steps.session.outputs.artifacts_expiry }}

      # outcome != 'skipped': no logs exist when an earlier step already failed
      - name: Upload session logs to GitHub
        if: always() && steps.run.outcome != 'skipped'
        uses: jahia/jahia-modules-action/upload-artifact@v2
        with:
          destination: "github"
          name: ai-issue-agent-logs
          path: ${{ runner.temp }}/issue-agent-logs
          retention-days: 2

      - name: Upload session logs to Jahia servers
        if: always() && steps.run.outcome != 'skipped'
        uses: jahia/jahia-modules-action/upload-artifact@v2
        with:
          destination: "jahia"
          name: ${{ steps.session.outputs.artifacts_name }}
          path: ${{ runner.temp }}/issue-agent-logs
          retention-days: 30
          ssh-key: ${{ secrets.BASTION_SSH_PRIVATE_KEY_JAHIACI }}

      # always(): the lock must be released and the session billed whatever the agent did.
      - name: Finalize the session — release the lock, settle the ledger
        if: always()
        uses: jahia/jahia-modules-action/ai-issue-agent/finalize@v2
        with:
          github_token: ${{ secrets.AI_AGENT_GH_ISSUES_PRS_CHORES }}
          issue_number: ${{ github.event.issue.number }}
          session_started_epoch: ${{ steps.session.outputs.started_epoch }}
          outcome: ${{ job.status }}
