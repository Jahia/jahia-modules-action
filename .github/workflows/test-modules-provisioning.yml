name: Test modules-provisioning

on:
  pull_request:
    paths:
      - 'modules-provisioning/**'
      - '.github/workflows/test-modules-provisioning.yml'

permissions:
  contents: read

jobs:
  test:
    name: Type check, tests and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules-provisioning
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules-provisioning/package-lock.json
      - run: npm ci
      - run: npm run all
      - name: Check that dist/ is the bundle of the sources
        run: git diff --exit-code -- dist
