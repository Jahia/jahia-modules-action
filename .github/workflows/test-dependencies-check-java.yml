# The unit tests of the action dependencies-check-java, on each pull request that changes it.
name: Test dependencies-check-java

on:
  pull_request:
    paths:
      - "dependencies-check-java/**"
      - ".github/workflows/test-dependencies-check-java.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
      - name: Run the unit tests
        working-directory: dependencies-check-java/tests
        run: python3 -m unittest discover -s . -v
