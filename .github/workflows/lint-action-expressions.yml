# Validates the template expressions in this repository's composite action manifests and
# workflows, on the branch itself.
#
# This has to be a repository-local workflow: delivery-pr-chores.yml calls the reusable
# workflows at @v2, so a PR's checks exercise the last release rather than the branch — which
# is how two expression errors reached @v2 and broke every consumer's PR Chores run.
#
# Note for editors: this file must not contain a literal template-expression opener, not even
# in a comment or a step name. The whole file is a template, so one would be evaluated here.
name: Lint - Action expressions

on:
  pull_request:
    paths:
      - "**/action.yml"
      - "**/action.yaml"
      - ".github/workflows/**"
      - ".github/scripts/check-action-expressions.py"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-expressions:
    name: Check action and workflow expressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Check every template expression resolves to a real context
        run: python3 .github/scripts/check-action-expressions.py
