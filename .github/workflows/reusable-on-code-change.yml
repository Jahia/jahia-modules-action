name: Reusable Workflow (On Code Change)
on:
  workflow_call:
    inputs:
        module_id:
            type: string
            required: true
        mvn_settings_filepath:
            type: string
            default: ".github/maven.settings.xml"
        module_branch:
            type: string
            default: ""
            description: "Ref to check out and test. Defaults to the ref that triggered the caller."
        update_signature_execute:
            type: boolean
            default: false
        static_analysis_instance_type:
            type: string
            default: "ubuntu-latest"
        static_analysis_auditci_level:
            type: string
            default: "critical"
            description: "Severity at which audit-ci fails. A module that gates lower than critical must keep declaring it, on every branch that runs this workflow."
        static_analysis_node_version:
            type: number
            default: 18
            description: "DEPRECATED and ignored when the module has a mise.toml — declare node there instead."
        build_instance_type:
            type: string
            default: "ubuntu-latest"
        build_container_image:
            type: string
            default: "ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-noble-mvn-loaded"
        sonar_analysis_primary_release_branch:
            type: string
            default: ""
            description: "Branch the analysis compares against. Defaults to the base branch of the pull request, then to the repository default branch."
        sonar_analysis_instance_type:
            type: string
            default: "ubuntu-latest"
        sonar_analysis_container_image:
            type: string
            default: "ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-noble-mvn-loaded"
        integration_tests_instance_type:
            type: string
            default: "self-hosted"
        integration_tests_standalone_execute:
            type: boolean
            default: false
            description: "Forces the standalone run. Left false, it runs anyway when a provisioning manifest is given and no cluster run is requested."
        integration_tests_cluster_execute:
            type: boolean
            default: false
        integration_tests_testrail_project:
            type: string
            default: ""
        integration_tests_pagerduty_skip_notification:
            type: boolean
            default: true
        integration_tests_provisioning_manifest:
            type: string
            default: ""
        integration_tests_should_use_build_artifacts:
            type: boolean
            default: false
            description: "DEPRECATED and ignored — build artifacts are downloaded whenever they are available."
        integration_tests_artifact_prefix:
            type: string
            default: ""
            description: "Prefix of the test artifacts, after the run type. Defaults to module_id."
        integration_tests_jahia_image:
            type: string
            default: "ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT"
            description: "Jahia image the tests run against. This value is passed down, so it also overrides whatever the module's own docker-compose.yml falls back to."
        integration_tests_pagerduty_incident_service:
            type: string
            default: ""
        integration_tests_timeout:
            type: number
            default: 65
        integration_tests_timeout_step:
            type: number
            default: 50
        integration_tests_profile:
            type: string
            default: ""
        integration_tests_elasticsearch_image:
            type: string
            default: ""
        integration_tests_jcustomer_image:
            type: string
            default: ""
        integration_tests_should_skip_testrail:
            type: boolean
            default: true
            description: "Skips publishing to TestRail, which is what a pull-request run wants. Set to false to publish."
        integration_tests_should_skip_pagerduty:
            type: boolean
            default: false
            description: "DEPRECATED and ignored — never forwarded to the test run. Use integration_tests_pagerduty_skip_notification."
        sbom_execute:
            type: boolean
            default: false
        sbom_container_image:
            type: string
            default: "cyclonedx/cyclonedx-cli:0.24.2"
        sbom_hostname:
            type: string
            default: ""
        sbom_artifacts:
            type: string
            default: "build-artifacts"
        publish_execute:
            type: boolean
            default: false
        publish_container_image:
            type: string
            default: "ghcr.io/jahia/jahia-docker-mvn-cache:8-jdk-noble-mvn-loaded"
        

jobs:
    update-signature:
        name: Update module signature
        runs-on: ubuntu-latest
        if: ${{ inputs.update_signature_execute }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                ref: ${{ inputs.module_branch || github.ref }}
            - uses: jahia/jahia-modules-action/update-signature@v2
              with:
                nexus_internal_releases_url: ${{ secrets.NEXUS_INTERNAL_RELEASES_URL }}
                nexus_username: ${{ secrets.NEXUS_USERNAME }}
                nexus_password: ${{ secrets.NEXUS_PASSWORD }}

    static-analysis:
      runs-on: ${{ inputs.static_analysis_instance_type }}
      steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
          with:
            ref: ${{ inputs.module_branch || github.ref }}
        - uses: jahia/jahia-modules-action/static-analysis@v2
          with:
            node_version: ${{ inputs.static_analysis_node_version }}
            auditci_level: ${{ inputs.static_analysis_auditci_level }}
    
    build:
        runs-on: ${{ inputs.build_instance_type }}
        env:
            NEXUS_INTERNAL_URL: ${{ secrets.NEXUS_INTERNAL_URL }}
        container:
            image: ${{ inputs.build_container_image }}
            credentials:
                username: ${{ secrets.GH_PACKAGES_USERNAME }}
                password: ${{ secrets.GH_PACKAGES_TOKEN }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                ref: ${{ inputs.module_branch || github.ref }}
            - uses: jahia/jahia-modules-action/build@v2
              with:
                mvn_settings_filepath: ${{ inputs.mvn_settings_filepath }}
                nexus_username: ${{ secrets.NEXUS_USERNAME }}
                nexus_password: ${{ secrets.NEXUS_PASSWORD }}

    sonar-analysis:
        runs-on: ${{ inputs.sonar_analysis_instance_type }}
        needs: build
        container:
            image: ${{ inputs.sonar_analysis_container_image }}
            credentials:
                username: ${{ secrets.GH_PACKAGES_USERNAME }}
                password: ${{ secrets.GH_PACKAGES_TOKEN }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                ref: ${{ inputs.module_branch || github.ref }}
            - uses: jahia/jahia-modules-action/sonar-analysis@v2
              with:
                primary_release_branch: ${{ inputs.sonar_analysis_primary_release_branch || github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
                github_pr_id: ${{github.event.number}}
                sonar_url: ${{ secrets.SONAR_URL }}
                sonar_token: ${{ secrets.SONAR_TOKEN }}
                mvn_settings_filepath: ${{ inputs.mvn_settings_filepath }}

    integration-tests-standalone:
        if: ${{ inputs.integration_tests_standalone_execute || (inputs.integration_tests_provisioning_manifest != '' && !inputs.integration_tests_cluster_execute) }}
        needs: build
        secrets: inherit
        uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
        with:
            instance_type: ${{ inputs.integration_tests_instance_type }}
            module_id: ${{ inputs.module_id }}
            testrail_project: ${{ inputs.integration_tests_testrail_project }}
            jahia_image: ${{ inputs.integration_tests_jahia_image }}
            pagerduty_skip_notification: ${{ inputs.integration_tests_pagerduty_skip_notification }}
            provisioning_manifest: ${{ inputs.integration_tests_provisioning_manifest }}
            artifact_prefix: standalone-${{ inputs.integration_tests_artifact_prefix || inputs.module_id }}
            module_branch: ${{ inputs.module_branch || github.ref }}
            timeout_job: ${{ inputs.integration_tests_timeout }}
            timeout_step: ${{ inputs.integration_tests_timeout_step }}
            tests_profile: ${{ inputs.integration_tests_profile }}
            elasticsearch_image: ${{ inputs.integration_tests_elasticsearch_image }}
            jcustomer_image: ${{ inputs.integration_tests_jcustomer_image }}
            should_skip_testrail: ${{ inputs.integration_tests_should_skip_testrail }}
            pagerduty_incident_service: ${{ inputs.integration_tests_pagerduty_incident_service }}
            jahia_cluster_enabled: false

    integration-tests-cluster:
        if: ${{ inputs.integration_tests_cluster_execute }}
        needs: build
        secrets: inherit
        uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
        with:
            instance_type: ${{ inputs.integration_tests_instance_type }}
            module_id: ${{ inputs.module_id }}
            testrail_project: ${{ inputs.integration_tests_testrail_project }}
            jahia_image: ${{ inputs.integration_tests_jahia_image }}
            pagerduty_skip_notification: ${{ inputs.integration_tests_pagerduty_skip_notification }}
            provisioning_manifest: ${{ inputs.integration_tests_provisioning_manifest }}
            artifact_prefix: cluster-${{ inputs.integration_tests_artifact_prefix || inputs.module_id }}
            module_branch: ${{ inputs.module_branch || github.ref }}
            timeout_job: ${{ inputs.integration_tests_timeout }}
            timeout_step: ${{ inputs.integration_tests_timeout_step }}
            tests_profile: ${{ inputs.integration_tests_profile }}
            elasticsearch_image: ${{ inputs.integration_tests_elasticsearch_image }}
            jcustomer_image: ${{ inputs.integration_tests_jcustomer_image }}
            should_skip_testrail: ${{ inputs.integration_tests_should_skip_testrail }}
            pagerduty_incident_service: ${{ inputs.integration_tests_pagerduty_incident_service }}
            jahia_cluster_enabled: true
    sbom:
        name: SBOM processing
        needs: build
        if: ${{ inputs.sbom_execute}}
        runs-on: ubuntu-latest
        container:
            image: ${{ inputs.sbom_container_image }}
        steps:
            - uses: jahia/jahia-modules-action/sbom-processing@v2
              with:
                dependencytrack_hostname: ${{ inputs.sbom_hostname }}
                dependencytrack_apikey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
                sbom_artifacts: ${{ inputs.sbom_artifacts }}
    publish:
        name: Publish module
        needs: [build]
        if: ${{ inputs.publish_execute }}
        runs-on: ubuntu-latest
        container:
            image: ${{ inputs.publish_container_image}}
            credentials:
                username: ${{ secrets.GH_PACKAGES_USERNAME }}
                password: ${{ secrets.GH_PACKAGES_TOKEN }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
            - uses: jahia/jahia-modules-action/publish@v2
              with:
                nexus_username: ${{ secrets.NEXUS_USERNAME }}
                nexus_password: ${{ secrets.NEXUS_PASSWORD }}
    