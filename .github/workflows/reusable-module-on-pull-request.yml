# The pull-request workflow of a Jahia module. No input: every job derives what it needs from the
# module-metadata action (pom.xml, package.json, mise.toml, tests/, .jahia.yml). A consumer calls it
# with a 6-line workflow and `secrets: inherit`.
#
# Every action and nested workflow is referenced at the same ref of jahia-modules-action as this
# file (`@reusable-module-workflows` while in development, the released alias afterwards), so a
# consumer pointing at the dev branch tests the branch's actions too. `uses:` takes no expression
# and the github context has no field for the called workflow's own commit, so the ref is a
# literal, replaced in one pass at release. The actions are not checked out into the module's
# workspace: anything placed there is indexed by Sonar, eslint and audit-ci.
name: Reusable module workflow (pull request)
on:
  workflow_call:

jobs:
  metadata:
    name: Module metadata
    runs-on: ubuntu-latest
    outputs:
      build-tool: ${{ steps.meta.outputs.build-tool }}
      module-id: ${{ steps.meta.outputs.module-id }}
      java: ${{ steps.meta.outputs.java }}
      cache-image: ${{ steps.meta.outputs.cache-image }}
      jahia-image: ${{ steps.meta.outputs.jahia-image }}
      signature-poms: ${{ steps.meta.outputs.signature-poms }}
      has-frontend: ${{ steps.meta.outputs.has-frontend }}
      has-js-tests: ${{ steps.meta.outputs.has-js-tests }}
      has-tests: ${{ steps.meta.outputs.has-tests }}
      cypress-matrix: ${{ steps.meta.outputs.cypress-matrix }}
      manifest-pr: ${{ steps.meta.outputs.manifest-pr }}
      cluster: ${{ steps.meta.outputs.cluster }}
      runner: ${{ steps.meta.outputs.runner }}
      audit-level: ${{ steps.meta.outputs.audit-level }}
      max-warnings: ${{ steps.meta.outputs.max-warnings }}
      timeout-job: ${{ steps.meta.outputs.timeout-job }}
      timeout-step: ${{ steps.meta.outputs.timeout-step }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - id: meta
        uses: jahia/jahia-modules-action/module-metadata@reusable-module-workflows
      - name: What this workflow derived
        run: |
          echo "called by ${{ github.workflow_ref }}"
          echo '${{ toJSON(steps.meta.outputs) }}'

  signature:
    name: Module signature
    needs: metadata
    if: needs.metadata.outputs.build-tool == 'maven' && needs.metadata.outputs.signature-poms != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - uses: jahia/jahia-modules-action/signature-verify@reusable-module-workflows
        with:
          poms: ${{ needs.metadata.outputs.signature-poms }}
          nexus_internal_releases_url: ${{ secrets.NEXUS_INTERNAL_RELEASES_URL || 'https://devtools.jahia.com/nexus/content/repositories/jahia-internal-releases' }}
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  static-analysis:
    name: Static analysis
    needs: metadata
    if: needs.metadata.outputs.has-frontend == 'true' || needs.metadata.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - uses: jahia/jahia-modules-action/static-analysis@reusable-module-workflows
        with:
          auditci_level: ${{ needs.metadata.outputs.audit-level }}
          max_warning: ${{ needs.metadata.outputs.max-warnings }}
          primary_release_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

  unit-tests-javascript:
    name: JavaScript unit tests
    needs: metadata
    if: needs.metadata.outputs.has-js-tests == 'true'
    runs-on: ${{ needs.metadata.outputs.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: yarn install
      - run: yarn test

  build:
    name: Build
    needs: metadata
    if: needs.metadata.outputs.build-tool == 'maven'
    runs-on: ${{ needs.metadata.outputs.runner }}
    container:
      image: ${{ needs.metadata.outputs.cache-image }}
    env:
      NEXUS_INTERNAL_URL: ${{ secrets.NEXUS_INTERNAL_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - uses: jahia/jahia-modules-action/build@reusable-module-workflows
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  build-javascript:
    name: Build (JavaScript)
    needs: metadata
    if: needs.metadata.outputs.build-tool == 'javascript'
    runs-on: ${{ needs.metadata.outputs.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - uses: jahia/jahia-modules-action/build-step-javascript@reusable-module-workflows

  sonar-analysis:
    name: Sonar analysis
    needs: [metadata, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.metadata.outputs.cache-image }}
    env:
      NEXUS_INTERNAL_URL: ${{ secrets.NEXUS_INTERNAL_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - uses: jahia/jahia-modules-action/sonar-analysis@reusable-module-workflows
        with:
          primary_release_branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          github_pr_id: ${{ github.event.number }}
          sonar_url: ${{ secrets.SONAR_URL }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  integration-tests:
    name: Integration tests ${{ matrix.profile }}
    needs: [metadata, build]
    if: needs.metadata.outputs.has-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.metadata.outputs.cypress-matrix) }}
    secrets: inherit
    # Nested reusable call: `uses` takes no expression, so this ref is edited by hand at release (@v2).
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@reusable-module-workflows
    with:
      module_id: ${{ needs.metadata.outputs.module-id }}
      jahia_image: ${{ needs.metadata.outputs.jahia-image }}
      jahia_cluster_enabled: ${{ needs.metadata.outputs.cluster == 'true' }}
      docker_build_cache_enabled: true
      provisioning_manifest: ${{ needs.metadata.outputs.manifest-pr }}
      tests_profile: ${{ matrix.profile }}
      artifact_prefix: pr-${{ needs.metadata.outputs.module-id }}${{ matrix.profile && format('-{0}', matrix.profile) || '' }}
      module_branch: ${{ github.ref }}
      timeout_job: ${{ fromJSON(needs.metadata.outputs.timeout-job) }}
      timeout_step: ${{ fromJSON(needs.metadata.outputs.timeout-step) }}
      should_skip_testrail: true
      skip_notifications: true
