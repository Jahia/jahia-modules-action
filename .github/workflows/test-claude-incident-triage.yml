# This workflow is used to manually validate the Claude incident-triage chain (issue selection,
# Claude Code setup, agent analysis) against an arbitrary repository, without going through a
# caller repository. Default target is Jahia/sandbox; dry_run only performs issue selection.
name: Test Claude Incident Triage

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to scan for automated-incident issues (owner/repo)"
        type: string
        required: false
        default: "Jahia/sandbox"
      dry_run:
        description: "Only run issue selection; do not start the agent"
        type: boolean
        required: false
        default: true
      instance_type:
        description: "Type of instances to run the agent job on (must be a host runner, not a container)"
        type: string
        required: false
        default: "self-hosted"
      cortex_ref:
        description: "Git ref of the cortex harness to use"
        type: string
        required: false
        default: "main"

jobs:
  select-issues:
    name: Select incident issues
    runs-on: ubuntu-slim
    outputs:
      issues: ${{ steps.select.outputs.issues }}
      has_issues: ${{ steps.select.outputs.has_issues }}
    steps:
      - name: Select eligible incident issues
        id: select
        uses: jahia/jahia-modules-action/claude-incident-triage/select-issues@feat/claude-incident-triage
        with:
          github_token: ${{ secrets.GH_ISSUES_PRS_CHORES }}
          repository: ${{ inputs.repository }}

  triage:
    name: Analyze incidents with Claude Code
    needs: select-issues
    if: ${{ !inputs.dry_run && needs.select-issues.outputs.has_issues == 'true' }}
    runs-on: ${{ inputs.instance_type }}
    timeout-minutes: 60
    steps:
      - name: Establish the Jahia VPN tunnel
        uses: jahia/jahia-modules-action/vpn-tunnel@v2
        with:
          config-base64: ${{ secrets.JC_WIREGUARD_VPN }}
          canary-url: https://app.dev.j.jahia.com

      - name: Set up Claude Code and the cortex harness
        id: setup
        uses: jahia/jahia-modules-action/claude-code-setup@feat/claude-incident-triage
        with:
          anthropic_base_url: ${{ vars.AI_LITELLM_BASE_URL }}
          anthropic_auth_token: ${{ secrets.AI_LITELLM_AUTH_TOKEN }}
          default_opus_model: ${{ vars.AI_LITELLM_ANTHROPIC_DEFAULT_OPUS_MODEL }}
          default_sonnet_model: ${{ vars.AI_LITELLM_ANTHROPIC_DEFAULT_SONNET_MODEL }}
          default_haiku_model: ${{ vars.AI_LITELLM_ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          cortex_ref: ${{ inputs.cortex_ref }}
          github_token: ${{ secrets.GH_ISSUES_PRS_CHORES }}

      - name: Triage the incident issues
        id: triage
        uses: jahia/jahia-modules-action/claude-incident-triage@feat/claude-incident-triage
        with:
          issues: ${{ needs.select-issues.outputs.issues }}
          repository: ${{ inputs.repository }}
          github_token: ${{ secrets.GH_ISSUES_PRS_CHORES }}
          cortex_path: ${{ steps.setup.outputs.cortex_path }}

      - name: Upload triage logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: claude-incident-triage-logs
          path: ${{ runner.temp }}/triage-logs
          if-no-files-found: ignore

      # Runners are normally ephemeral, but belt-and-braces for any persistent runner:
      # vpn-tunnel has no teardown of its own.
      - name: Tear down the VPN tunnel
        if: always()
        shell: bash
        run: sudo wg-quick down /etc/wireguard/wg0.conf || true
