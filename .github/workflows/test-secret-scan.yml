# Temporary: runs the branch version of the secret-scan action on its own pull request.
# Removed before merge, because the reference names the feature branch.
name: Test secret scan

on:
  pull_request:
    paths:
      - 'secret-scan/**'
      - '.github/workflows/test-secret-scan.yml'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (branch version)
    runs-on: ubuntu-slim
    steps:
      - uses: jahia/jahia-modules-action/secret-scan@feat/secret-scan
